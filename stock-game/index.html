<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미래경제 5년 · 모의주식 투자 게임</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#151a2d; --sub:#646b80; --line:#e4e6ec;
  --navy:#18203d; --gold:#f2b705; --up:#e5304a; --down:#2563eb; --ok:#14a36b;
  --r:16px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:20px 18px 120px}
.top{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px}
.logo b{color:var(--gold)}
.top .sp{flex:1}
.pill{background:rgba(255,255,255,.12);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.gold{background:var(--gold);color:var(--navy)}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 1px 2px rgba(20,25,45,.06),0 4px 16px rgba(20,25,45,.04)}
h1{font-size:28px;margin:0 0 6px;letter-spacing:-.5px}
h2{font-size:20px;margin:28px 0 12px;letter-spacing:-.3px}
.muted{color:var(--sub)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--navy);color:#fff;transition:transform .08s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#eceef3;color:var(--ink)}
.btn.big{padding:16px 26px;font-size:18px;border-radius:14px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
input.f,select.f{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input.f:focus,select.f:focus{border-color:var(--navy)}
label.l{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:#b4233a}

/* 뉴스 */
.news{border-left:5px solid var(--navy);padding:16px 18px}
.news .tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:6px;background:#eef0f6;color:var(--navy);margin-bottom:8px}
.news.rumor{border-left-color:#9aa1b5;background:repeating-linear-gradient(-45deg,#fff,#fff 10px,#fafafc 10px,#fafafc 20px)}
.news.rumor .tag{background:#ffe9b0;color:#7a5800}
.news.breaking{border-left-color:var(--up);background:#fff5f6;animation:flash 1.2s 2}
.news.breaking .tag{background:var(--up);color:#fff}
@keyframes flash{50%{box-shadow:0 0 0 6px rgba(229,48,74,.25)}}
.quiz{border:2px solid #c9d8ff;background:#f5f8ff}
.quiz .qq{font-weight:800;font-size:17px;margin:6px 0 12px;line-height:1.5}
.qo{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:8px;font-weight:700;cursor:pointer}
.qo.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.qo.right{border-color:var(--ok);background:var(--ok);color:#fff}
.mvp{background:linear-gradient(135deg,#18203d,#2c3a6e);color:#fff;border-radius:var(--r);padding:18px 22px;display:flex;align-items:center;gap:16px}
.mvp .big{font-size:40px}
.mvp b{color:var(--gold)}
.mv{font-size:12px;font-weight:800;margin-left:6px}
.news.warn{border-left-color:var(--up)}
.news.warn .tag{background:#ffe1e5;color:var(--up)}
.news.ipo{border-left-color:var(--gold)}
.news .t{font-weight:800;font-size:17px;line-height:1.4}
.news .b{color:var(--sub);font-size:14.5px;line-height:1.6;margin-top:6px}

/* 회사 */
.co{display:flex;flex-direction:column;gap:10px;position:relative}
.co .hd{display:flex;align-items:center;gap:10px}
.co .em{font-size:28px;width:44px;height:44px;border-radius:12px;background:#f1f2f6;display:flex;align-items:center;justify-content:center}
.co .nm{font-weight:800;font-size:16px}
.co .sc{font-size:12.5px;color:var(--sub)}
.co .pr{margin-left:auto;text-align:right}
.co .pr .p{font-weight:800}
.co .pr .c{font-size:12.5px;font-weight:700}
.co.on{outline:2.5px solid var(--navy)}
.co .new{position:absolute;top:-8px;right:12px;background:var(--gold);color:var(--navy);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.amt{display:flex;align-items:center;gap:8px}
.amt input{flex:1;min-width:0;text-align:right;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-weight:800;font-size:18px}
.amt input:focus{border-color:var(--navy);outline:none}
.amt .u{font-size:14px;color:var(--sub);font-weight:700}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stepper button{border:0;background:#eef0f5;border-radius:8px;padding:8px 0;font-weight:700;cursor:pointer;font-size:13px}
.stepper button:hover{background:#e2e5ec}
.spark{width:100%;height:34px}

/* 하단 바 */
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;z-index:30;box-shadow:0 -6px 24px rgba(20,25,45,.07)}
.bar .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.meter{flex:1;min-width:220px}
.meter .track{height:10px;background:#eceef3;border-radius:99px;overflow:hidden;margin-top:6px}
.meter .fill{height:100%;background:var(--navy);transition:width .2s}

/* 카드(아이템) */
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.item{border:2px dashed var(--line);border-radius:14px;padding:14px;background:#fff}
.item.sel{border:2px solid var(--gold);background:#fffaea}
.item.used{opacity:.45}
.item .it{font-weight:800}
.item .id{font-size:13px;color:var(--sub);margin:4px 0 10px;line-height:1.5}
.hint{background:#f0f6ff;border-radius:10px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:8px}

/* 공개 */
.shock{background:linear-gradient(135deg,#b4233a,#e5304a);color:#fff;border-radius:var(--r);padding:26px;animation:shake .6s 1}
.shock h2{margin:0 0 8px;font-size:26px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.rv{display:grid;grid-template-columns:200px 1fr 90px;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border:0}
.rv .bt{height:22px;background:#f1f2f6;border-radius:6px;position:relative;overflow:hidden}
.rv .bf{position:absolute;top:0;bottom:0;border-radius:6px}
.rv .ex{grid-column:2 / 4;font-size:14px;color:var(--sub);margin-top:-6px}
.rv .pc{font-weight:900;font-size:20px;text-align:right}
.pop{opacity:0;animation:pop .5s forwards}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.grow{animation:grow 1s ease-out forwards;transform-origin:left;transform:scaleX(0)}
@keyframes grow{to{transform:scaleX(1)}}

/* 순위 */
table.rank{width:100%;border-collapse:collapse}
table.rank td,table.rank th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
table.rank th{font-size:13px;color:var(--sub)}
table.rank td.n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
table.rank tr.me{background:#fffaea}
.medal{font-size:20px}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:20px 0}
.podium .pd{text-align:center;width:170px}
.podium .blk{background:var(--navy);color:var(--gold);border-radius:12px 12px 0 0;font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.badge{background:#fff;border-radius:14px;padding:16px;border:2px solid #f3e3a8}
.badge .bi{font-size:30px}
.badge .bn{font-weight:800;margin-top:4px}
.badge .bw{font-size:20px;font-weight:900;margin-top:6px}
.badge .bd{font-size:13px;color:var(--sub);margin-top:4px}

/* 교사(프로젝터) */
body.teacher .news .t{font-size:22px}
body.teacher .news .b{font-size:17px}
body.teacher .rv .nm{font-size:20px}
.bigcode{font-size:64px;font-weight:900;letter-spacing:10px;color:var(--navy);font-variant-numeric:tabular-nums}
.timer{font-size:56px;font-weight:900;font-variant-numeric:tabular-nums}
.timer.late{color:var(--up);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 12px;border-radius:999px;background:#eceef3;font-weight:700;font-size:14px}
.chip.done{background:var(--ok);color:#fff}
.yearbig{font-size:22px;font-weight:900}
.passing{font-size:44px;font-weight:900;text-align:center;padding:50px 0;animation:pop .6s forwards}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .card{max-width:640px;width:100%;max-height:85vh;overflow:auto}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{border:0;padding:10px 16px;border-radius:10px;background:#e7e9ef;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
@media (max-width:640px){.rv{grid-template-columns:120px 1fr 70px}.bigcode{font-size:44px}.timer{font-size:40px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===================== 설정 =====================
const SUPABASE_URL = 'https://unragzxjbbwlpvptojhi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ur23GreBnNG8bhEOnsKrDQ_OoDvm6I5';
const START_YEAR = 2026;      // 1라운드 = 2027년
const START_MONEY = 10000000;
// ================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
const qs = new URLSearchParams(location.search);
let COMPANIES = [];
let timers = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
const man = n => { const m = n / 10000; return m >= 10000 ? (m/10000).toFixed(2) + '억원' : Math.round(m).toLocaleString('ko-KR') + '만원'; };
const pctTxt = p => (p > 0 ? '+' : '') + (Math.round(p * 10) / 10) + '%';
const cls = p => p > 0.0001 ? 'up' : p < -0.0001 ? 'down' : 'flat';
const year = r => START_YEAR + r;
const co = id => COMPANIES.find(c => c.id === id) || {name:id, emoji:'❓', sector:''};
const medal = i => ['🥇','🥈','🥉'][i] || (i + 1);

function toast(msg, err) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
async function rpc(fn, args) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw new Error(error.message);
  return data;
}
async function q(promise) { const { data, error } = await promise; if (error) throw new Error(error.message); return data; }
function clearTimers() { timers.forEach(clearInterval); timers = []; }
function every(ms, fn) { timers.push(setInterval(fn, ms)); }

async function loadCompanies() { COMPANIES = await q(sb.from('sg_companies').select('*').order('ord')); }
const loadGame = id => q(sb.from('sg_games').select('*').eq('id', id).single());
const loadPlayers = gid => q(sb.from('sg_players').select('id,number,nickname,value,cards_used,submitted_round').eq('game_id', gid).order('number'));
const loadReveals = gid => q(sb.from('sg_reveals').select('*').eq('game_id', gid).order('round'));
const loadResults = gid => q(sb.from('sg_results').select('*').eq('game_id', gid).order('round'));

// 주가: 시작 10,000원, 공개된 연도만큼 누적
function priceAfter(cid, rounds, reveals) {
  let p = 10000;
  for (let r = 1; r <= rounds; r++) {
    const rv = reveals.find(x => x.round === r); const e = rv && rv.effects.find(e => e.company === cid);
    if (e) p *= 1 + e.pct / 100;
  }
  return p;
}
function effectOf(cid, r, reveals) { const rv = reveals.find(x => x.round === r); const e = rv && rv.effects.find(e => e.company === cid); return e ? +e.pct : null; }
function spark(cid, upto, reveals) {
  const c = co(cid); const from = Math.max(0, c.ipo_round - 1); const pts = [];
  for (let r = from; r <= upto; r++) pts.push(priceAfter(cid, r, reveals));
  if (pts.length < 2) return `<div class="muted" style="font-size:12px;height:34px;display:flex;align-items:center">${upto === 0 ? '📍 10,000원에서 출발' : '🔔 올해 새로 상장한 회사예요'}</div>`;
  const mx = Math.max(...pts), mn = Math.min(...pts), W = 200, H = 34;
  const d = pts.map((p, i) => `${(i / (pts.length - 1) * W).toFixed(1)},${(H - 4 - (mx === mn ? .5 : (p - mn) / (mx - mn)) * (H - 8)).toFixed(1)}`).join(' ');
  const col = pts.at(-1) >= pts[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
function newsCard(n) {
  const k = n.tag === '루머' ? 'rumor' : n.tag === '경고' ? 'warn' : n.tag === '상장' ? 'ipo' : n.tag === '속보' ? 'breaking' : '';
  return `<div class="card news ${k}"><span class="tag">${esc(n.tag)}</span><div class="t">${esc(n.title)}</div><div class="b">${esc(n.body)}</div></div>`;
}
const curNews = (list, r) => { const a = list.filter(n => n.round === r); return [...a.filter(n => n.tag === '속보'), ...a.filter(n => n.tag !== '속보')]; };
function roundMvp(results, players, r) {
  let best = null;
  results.filter(x => x.round === r).forEach(x => { const g = x.value_after / x.value_before - 1; if (!best || g > best.g) best = { g, id: x.player_id }; });
  if (!best) return null; const p = players.find(x => x.id === best.id);
  return p ? { name: p.nickname, g: best.g * 100 } : null;
}
function mvpBox(m, r) {
  return m ? `<div class="mvp"><div class="big">🌟</div><div><div style="font-size:14px;opacity:.8;font-weight:700">${year(r)}년 올해의 투자왕</div><div style="font-size:24px;font-weight:900"><b>${esc(m.name)}</b> · ${pctTxt(m.g)}</div></div></div>` : '';
}
function quizAnswerBox(qz) {
  if (!qz) return '';
  return `<div class="card quiz"><b>📝 올해의 경제 퀴즈 정답</b><div class="qq">${esc(qz.question)}</div>
    ${qz.options.map((o, i) => `<div class="qo ${i + 1 === qz.answer ? 'right' : ''}">${i + 1}. ${esc(o)}</div>`).join('')}
    <div class="muted" style="line-height:1.6">${esc(qz.explain)}</div></div>`;
}
function topBar(right) {
  return `<div class="top"><div class="logo">📈 미래경제 <b>5년</b></div><div class="sp"></div>${right || ''}</div>`;
}

// ---------- 배지 계산 ----------
function computeBadges(players, results, reveals) {
  const byP = {}; players.forEach(p => byP[p.id] = results.filter(r => r.player_id === p.id));
  const name = id => { const p = players.find(x => x.id === id); return p ? `${p.nickname}` : '?'; };
  const best = (scoreFn, minScore = -Infinity) => {
    let bid = null, bs = -Infinity;
    players.forEach(p => { const s = scoreFn(byP[p.id], p); if (s > bs || (s === bs && bid && p.value > players.find(x => x.id === bid).value)) { bs = s; bid = p.id; } });
    return bid && bs > minScore ? { who: name(bid), score: bs } : null;
  };
  const sumAlloc = a => Object.values(a || {}).reduce((s, v) => s + +v, 0);
  const out = [];
  const div = best(rs => rs.length ? rs.reduce((s, r) => s + Object.values(r.alloc).filter(v => v >= r.value_before * 0.1).length, 0) / rs.length : 0, 0);
  if (div) out.push({ i:'🧺', n:'분산투자왕', who:div.who, d:`한 해 평균 ${div.score.toFixed(1)}개 회사에 골고루 나눠 투자했어요.` });
  const contra = best(rs => rs.reduce((s, r) => {
    if (r.round < 2) return s;
    return s + Object.entries(r.alloc).reduce((ss, [cid, amt]) => {
      const prev = effectOf(cid, r.round - 1, reveals), now = effectOf(cid, r.round, reveals);
      return (prev !== null && prev <= -10 && now > 0) ? ss + amt * now / 100 : ss;
    }, 0);
  }, 0), 0);
  if (contra) out.push({ i:'🔄', n:'역발상 투자자', who:contra.who, d:`남들이 떠난 폭락 주식으로 ${man(contra.score)}을 벌었어요.` });
  // 가장 힘들었던 해에 가장 잘 버틴 사람
  let worstR = null, worstAvg = Infinity;
  [...new Set(results.map(r => r.round))].forEach(rd => {
    const rs = results.filter(r => r.round === rd); const avg = rs.reduce((s, r) => s + r.value_after / r.value_before, 0) / rs.length;
    if (avg < worstAvg) { worstAvg = avg; worstR = rd; }
  });
  if (worstR) {
    const iron = best(rs => { const r = rs.find(x => x.round === worstR); return r ? r.value_after / r.value_before - 1 : -9; });
    if (iron) out.push({ i:'🛡️', n:'강철 멘탈', who:iron.who, d:`가장 힘들었던 ${year(worstR)}년에 ${pctTxt(iron.score * 100)}로 가장 잘 버텼어요.` });
  }
  const qk = best(rs => rs.filter(r => r.quiz_correct).length, 0);
  if (qk) out.push({ i:'📝', n:'경제 퀴즈왕', who:qk.who, d:`경제 퀴즈를 ${qk.score}문제 맞혔어요.` });
  const safe = best(rs => rs.length ? rs.reduce((s, r) => s + (1 - sumAlloc(r.alloc) / r.value_before), 0) / rs.length : 0, 0.3);
  if (safe) out.push({ i:'🐢', n:'안전제일', who:safe.who, d:`평균 ${Math.round(safe.score * 100)}%를 예금에 넣는 신중파였어요.` });
  return out;
}

// =====================================================
//                       학생
// =====================================================
const S = { token:null, me:null, game:null, sub:null, hint:null, alloc:{}, card:null, cardTarget:null, key:'', reveals:[], news:[], quiz:null, quizAns:null };
const gkey = g => g.phase + ':' + g.round + ':' + (g.breaking_round || 0);

async function studentBoot() {
  const tok = localStorage.getItem('sg_token');
  if (tok) {
    try {
      const r = await rpc('sg_me', { p_token: tok });
      const urlCode = (qs.get('code') || '').toUpperCase();
      // 끝난 게임이거나, 다른 반 링크로 들어왔으면 이전 기록은 건너뛰기
      if (r.game.phase !== 'final' && (!urlCode || urlCode === r.game.code)) return studentResumeAsk(tok, r);
    } catch (e) {}
    localStorage.removeItem('sg_token');
  }
  studentJoin();
}
function studentResumeAsk(tok, r) {
  app.innerHTML = topBar() + `<div class="wrap center"><div class="card" style="max-width:460px;width:100%;text-align:center">
    <div style="font-size:48px">🙋</div><h1>이 노트북에 하던 게임이 있어요</h1>

  </div></div>`;
  document.getElementById('jswap').onclick = e => { e.preventDefault(); studentJoin(!rejoin); };

async function studentRefresh(force) {
  const r = await rpc('sg_me', { p_token: S.token });
  const key = gkey(r.game);
  const sameYear = S.key && S.key.split(':').slice(0, 2).join(':') === key.split(':').slice(0, 2).join(':');
  S.me = r.player; S.game = r.game;
  if (force || key !== S.key) {
    const onlyBreaking = !force && sameYear;
    S.key = key; S.hint = r.hint; S.quizAns = r.quiz_answer;
    if (!onlyBreaking) {
      S.sub = r.submission; S.alloc = {}; S.card = null; S.cardTarget = null;
      if (S.sub) {
        Object.entries(S.sub.alloc).forEach(([k, v]) => S.alloc[k] = Math.floor(v / 10000));
        S.card = S.sub.card; S.cardTarget = S.sub.card_target;
      }
    }
    [S.reveals, S.news, S.quiz] = await Promise.all([loadReveals(S.game.id), rpc('sg_news', { p_code: S.game.code }),
      S.game.phase === 'invest' ? rpc('sg_quiz', { p_code: S.game.code }) : null]);
    if (onlyBreaking) toast('📢 속보가 발표됐어요! 뉴스를 확인하세요.');
    await studentRender();
    studentWatch();
  }
}

function studentLogout() {
  if (!confirm('이 노트북에서 나갈까요? 다시 들어오려면 선생님께 재입장 코드를 받아야 해요.')) return;
  localStorage.removeItem('sg_token'); clearTimers();
  if (S.chan) { sb.removeChannel(S.chan); S.chan = null; }
  S.token = null; S.key = ''; studentJoin();
}
function studentWatch() {
  clearTimers();
  every(4000, async () => {
    try { const g = await loadGame(S.game.id); if (gkey(g) !== S.key) await studentRefresh(); else S.game = g; } catch (e) {}
  });
  if (S.game.phase === 'invest') every(1000, () => {
    const el = document.getElementById('stimer'); if (!el || !S.game.deadline) return;
    const left = Math.max(0, Math.round((new Date(S.game.deadline) - Date.now()) / 1000));
    el.textContent = left > 0 ? `⏱ ${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}` : '⏱ 곧 마감!';
  });
  if (!S.chan) {
    S.chan = sb.channel('g-' + S.game.id).on('postgres_changes', { event:'UPDATE', schema:'public', table:'sg_games', filter:'id=eq.' + S.game.id },
      () => studentRefresh().catch(() => {})).subscribe();
  }
}

function availCos() { return COMPANIES.filter(c => c.ipo_round <= S.game.round); }
function maxUnits() { return Math.floor(S.me.value / 10000); }
function usedUnits() { return Object.values(S.alloc).reduce((s, v) => s + (v || 0), 0); }

function studentInvest() {
  const g = S.game, r = g.round, used = S.me.cards_used || [];
  const thisNews = curNews(S.news, r), oldNews = S.news.filter(n => n.round < r);
  const cos = availCos().map(c => {
    const price = priceAfter(c.id, r - 1, S.reveals), last = effectOf(c.id, r - 1, S.reveals);
    const isNew = c.ipo_round === r && r > 1;
    return `<div class="card co ${S.alloc[c.id] ? 'on' : ''}" id="co-${c.id}">
      ${isNew ? '<span class="new">NEW 신규상장</span>' : ''}
      <div class="hd"><div class="em">${c.emoji}</div><div><div class="nm">${esc(c.name)}</div><div class="sc">${esc(c.sector)}</div></div>
        <div class="pr"><div class="p">${won(price)}</div><div class="c ${cls(last)}">${last === null ? '-' : '작년 ' + pctTxt(last)}</div></div></div>
      <div class="sc" style="line-height:1.5">${esc(c.descr)}</div>
      ${spark(c.id, r - 1, S.reveals)}
      <div class="amt"><input type="number" min="0" data-in="${c.id}" value="${S.alloc[c.id] || 0}"><span class="u">만원</span></div>
      <div class="stepper"><button data-d="-100" data-c="${c.id}">-100</button><button data-d="-10" data-c="${c.id}">-10</button><button data-d="10" data-c="${c.id}">+10</button><button data-d="100" data-c="${c.id}">+100</button></div>
    </div>`;
  }).join('');
  const opts = availCos().map(c => `<option value="${c.id}">${c.emoji} ${esc(c.name)}</option>`).join('');
  const item = (k, ic, t, d, extra) => {
    const isUsed = used.includes(k) && !(k === 'analyst' && S.hint);
    return `<div class="item ${S.card === k ? 'sel' : ''} ${isUsed ? 'used' : ''}" id="it-${k}"><div class="it">${ic} ${t} ${isUsed ? '· 사용함' : ''}</div><div class="id">${d}</div>${isUsed ? '' : extra}</div>`;
  };
  app.innerHTML = studentHeader() + `<div class="wrap">
    <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><h1>📰 ${year(r)}년 뉴스</h1><span class="muted yearbig" id="stimer"></span></div>
    <p class="muted" style="margin-top:0">뉴스를 읽고 어떤 회사가 오르고 내릴지 생각해 보세요. 한 뉴스가 여러 회사에 영향을 줄 수도 있어요!</p>
    <div class="grid g2">${thisNews.map(newsCard).join('')}</div>
    ${oldNews.length ? `<details style="margin-top:14px"><summary class="muted" style="cursor:pointer;font-weight:700">지난 뉴스 다시 보기 (${oldNews.length}개)</summary>
      <div class="grid g2" style="margin-top:10px">${oldNews.map(n => newsCard({ ...n, title: `[${year(n.round)}] ` + n.title })).join('')}</div></details>` : ''}
    <h2>🏢 투자할 회사 고르기 <span class="muted" style="font-size:14px;font-weight:600">· 단위: 만원</span></h2>
    <div class="grid g3">${cos}</div>
    ${S.quiz ? `<h2>📝 올해의 경제 퀴즈 <span class="muted" style="font-size:14px;font-weight:600">· 맞히면 보너스 30만원!</span></h2>
    <div class="card quiz"><div class="qq">${esc(S.quiz.question)}</div>
      ${S.quiz.options.map((o, i) => `<button class="qo ${S.quizAns === i + 1 ? 'sel' : ''}" data-q="${i + 1}">${i + 1}. ${esc(o)}</button>`).join('')}
      <div class="muted" style="font-size:13px" id="qmsg">${S.quizAns ? '✅ 답이 저장됐어요. 마감 전까지 바꿀 수 있어요.' : '보기를 누르면 바로 저장돼요.'}</div></div>` : ''}
    <h2>🃏 찬스 카드 <span class="muted" style="font-size:14px;font-weight:600">· 게임 전체에서 각각 한 번만!</span></h2>
    <div class="items">
      ${item('insurance', '🛡️', '손실 보험', '올해 내 돈이 줄어들면, 줄어든 금액의 절반을 돌려받아요.', `<button class="btn sm ${S.card === 'insurance' ? 'gold' : 'ghost'}" data-card="insurance">${S.card === 'insurance' ? '✓ 사용 예약됨' : '올해 사용하기'}</button>`)}
      ${item('analyst', '🔍', '애널리스트 리포트', '회사 하나의 올해 전망을 미리 볼 수 있어요. (바로 사용됨)',
        S.hint ? `<div class="hint">${co(S.hint.company).emoji} ${esc(co(S.hint.company).name)}: ${esc(S.hint.hint)}</div>`
               : `<select class="f" id="anasel" style="padding:8px;margin-bottom:8px"><option value="">회사 선택</option>${opts}</select><button class="btn sm ghost" id="anago">리포트 보기</button>`)}
    </div>
  </div>
  <div class="bar"><div class="in">
    <div class="meter"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px"><span id="m-used"></span><span id="m-left" class="muted"></span></div><div class="track"><div class="fill" id="m-fill"></div></div></div>
    <button class="btn ghost" id="b-even">골고루 나누기</button><button class="btn ghost" id="b-reset">초기화</button>
    <button class="btn gold big" id="b-sub">${S.sub ? '✅ 제출됨 · 수정하기' : '투자 제출하기'}</button>
  </div></div>`;

  const setVal = (cid, v) => {
    v = Math.max(0, Math.floor(+v || 0));
    const others = usedUnits() - (S.alloc[cid] || 0);
    v = Math.min(v, maxUnits() - others);
    S.alloc[cid] = v;
    const inp = document.querySelector(`[data-in="${cid}"]`); if (inp) inp.value = v;
    document.getElementById('co-' + cid).classList.toggle('on', v > 0);
    meter(); markDirty();
  };
  const markDirty = () => { if (S.sub) document.getElementById('b-sub').textContent = '수정한 내용 제출하기'; };
  const meter = () => {
    const u = usedUnits(), m = maxUnits();
    document.getElementById('m-used').textContent = `투자 ${u.toLocaleString()}만원`;
    document.getElementById('m-left').textContent = `남은 ${won(S.me.value - u * 10000)} → 예금 3%`;
    document.getElementById('m-fill').style.width = (m ? u / m * 100 : 0) + '%';
  };
  meter();
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => setVal(b.dataset.c, (S.alloc[b.dataset.c] || 0) + +b.dataset.d));
  document.querySelectorAll('[data-in]').forEach(i => i.onchange = () => setVal(i.dataset.in, i.value));
  document.getElementById('b-reset').onclick = () => { availCos().forEach(c => { S.alloc[c.id] = 0; }); availCos().forEach(c => setVal(c.id, 0)); };
  document.getElementById('b-even').onclick = () => {
    const cs = availCos(); const each = Math.floor(maxUnits() / cs.length);
    cs.forEach(c => S.alloc[c.id] = 0); cs.forEach(c => setVal(c.id, each));
  };
  document.querySelectorAll('[data-card]').forEach(b => b.onclick = () => {
    const k = b.dataset.card;
    if (S.card === k) { S.card = null; S.cardTarget = null; }
    else {
      S.cardTarget = null;
      S.card = k;
    }
    markDirty(); const keepAlloc = { ...S.alloc }; studentInvest(); S.alloc = keepAlloc;
    if (S.sub) document.getElementById('b-sub').textContent = '수정한 내용 제출하기';
  });
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = async () => {
    try {
      await rpc('sg_answer_quiz', { p_token: S.token, p_answer: +b.dataset.q }); S.quizAns = +b.dataset.q;
      document.querySelectorAll('[data-q]').forEach(x => x.classList.toggle('sel', x === b));
      document.getElementById('qmsg').textContent = '✅ 답이 저장됐어요. 마감 전까지 바꿀 수 있어요.';
    } catch (e) { toast(e.message, true); }
  });
  const ag = document.getElementById('anago');
  if (ag) ag.onclick = async () => {
    const c = document.getElementById('anasel').value; if (!c) return toast('회사를 먼저 골라 주세요.', true);
    if (!confirm(`${co(c).name}의 리포트를 볼까요? 이 카드는 게임에서 한 번만 쓸 수 있어요.`)) return;
    try {
      const h = await rpc('sg_use_analyst', { p_token: S.token, p_company: c });
      S.hint = { company: h.company, hint: h.hint }; S.me.cards_used = [...(S.me.cards_used || []), 'analyst'];
      const keep = { ...S.alloc }; studentInvest(); S.alloc = keep;
    } catch (e) { toast(e.message, true); }
  };
  document.getElementById('b-sub').onclick = async () => {
    const alloc = {}; Object.entries(S.alloc).forEach(([k, v]) => { if (v > 0) alloc[k] = v * 10000; });
    try {
      await rpc('sg_submit', { p_token: S.token, p_alloc: alloc, p_card: S.card, p_card_target: S.cardTarget });
      S.sub = { alloc, card: S.card, card_target: S.cardTarget };
      document.getElementById('b-sub').textContent = '✅ 제출됨 · 수정하기';
      toast('제출 완료! 마감 전까지는 언제든 고칠 수 있어요.');
    } catch (e) { toast(e.message, true); }
  };
}

function myLine(res, reveals) {
  const rows = Object.entries(res.alloc).map(([cid, amt]) => {
    const e = effectOf(cid, res.round, reveals) || 0; const m = 1;
    const after = amt * Math.max(0, 1 + e * m / 100);
    return `<tr><td>${co(cid).emoji} ${esc(co(cid).name)}</td><td class="n">${man(amt)}</td><td class="n ${cls(e)}">${pctTxt(e * m)}</td><td class="n">${man(after)}</td></tr>`;
  });
  const inv = Object.values(res.alloc).reduce((s, v) => s + +v, 0), dep = res.value_before - inv;
  if (dep > 0) rows.push(`<tr><td>🏦 예금</td><td class="n">${man(dep)}</td><td class="n up">+3%</td><td class="n">${man(dep * 1.03)}</td></tr>`);
  return `<table class="rank"><tr><th>투자처</th><th style="text-align:right">넣은 돈</th><th style="text-align:right">변화</th><th style="text-align:right">1년 뒤</th></tr>${rows.join('')}</table>
    ${res.quiz_correct === true ? `<div class="hint" style="margin-top:10px;background:#e8f8ef">📝 경제 퀴즈 정답! 보너스 +30만원</div>` : res.quiz_correct === false ? `<div class="hint" style="margin-top:10px;background:#f4f5f8">📝 경제 퀴즈는 아쉽게 틀렸어요.</div>` : ''}
    ${res.card === 'insurance' ? `<div class="hint" style="margin-top:10px">🛡️ 손실 보험 사용${res.value_after > res.value_before ? ' (돈이 늘어서 보험은 필요 없었어요)' : ' — 손실의 절반을 돌려받았어요'}</div>` : ''}`;
}

async function studentReveal() {
  const g = S.game;
  const [ps, yr] = await Promise.all([loadPlayers(g.id), q(sb.from('sg_results').select('*').eq('game_id', g.id).eq('round', g.round))]);
  const res = yr.find(x => x.player_id === S.me.id); const mvp = roundMvp(yr, ps, g.round); const rank = ps.slice().sort((a, b) => b.value - a.value).findIndex(p => p.id === S.me.id);
  const rv = S.reveals.find(x => x.round === g.round);
  const ch = res ? (res.value_after / res.value_before - 1) * 100 : 0;
  app.innerHTML = studentHeader() + `<div class="wrap">
    <h1>📅 ${year(g.round)}년이 지났어요</h1>
    ${rv && rv.shock_title ? `<div class="shock" style="margin:14px 0"><h2>${esc(rv.shock_title)}</h2><div>${esc(rv.shock_body)}</div></div>` : ''}
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><div class="muted" style="font-weight:700">내 자산</div>
        <div style="font-size:34px;font-weight:900;margin:6px 0">${man(S.me.value)}</div>
        <div class="${cls(ch)}" style="font-weight:800;font-size:18px">${res ? `${man(res.value_before)} → ${pctTxt(ch)}` : ''}</div>
        <div style="margin-top:10px;font-weight:800">🏅 우리 반 ${rank + 1}등 / ${ps.length}명</div></div>
      <div class="card">${res ? myLine(res, S.reveals) : '<div class="muted">이번 해에는 참여 기록이 없어요.</div>'}
        ${res && !Object.keys(res.alloc).length ? '<div class="muted" style="margin-top:8px">투자를 제출하지 않아 모두 예금에 들어갔어요.</div>' : ''}</div>

function rankTable(list, prevMap, limit) {

    const pv = showYr ? prevMap[p.id] : START_MONEY; const ch = pv ? (p.value / pv - 1) * 100 : 0;
    return `<tr><td class="medal">${medal(i)}</td><td style="font-weight:700">${esc(p.nickname)}${showYr && prevRank[p.id] !== undefined && prevRank[p.id] !== i ? `<span class="mv ${prevRank[p.id] > i ? 'up' : 'down'}">${prevRank[p.id] > i ? '▲' : '▼'}${Math.abs(prevRank[p.id] - i)}</span>` : ''}</td><td class="n">${man(p.value)}</td><td class="n ${cls(ch)}">${pv ? pctTxt(ch) : '-'}</td></tr>`;

}
function teacherReveal() {

  const sorted = T.players.slice().sort((a, b) => b.value - a.value);
  const badges = computeBadges(T.players, T.results, T.reveals);
  const avg = T.players.length ? T.players.reduce((s, p) => s + p.value, 0) / T.players.length : 0;
  const pod = [1, 0, 2].map(i => sorted[i] ? `<div class="pd pop" style="animation-delay:${[1.2, 2.4, .4][[1, 0, 2].indexOf(i)]}s"><div style="font-size:22px;font-weight:900">${esc(sorted[i].nickname)}</div><div class="muted" style="font-weight:700;margin-bottom:8px">${man(sorted[i].value)}</div><div class="blk" style="height:${[170, 120, 90][i]}px">${medal(i)}</div></div>` : '').join('');
  app.innerHTML = teacherHeader() + `<div class="wrap"><h1 style="font-size:38px;text-align:center">🎉 5년 투자 최종 시상식</h1>
    <p class="muted" style="text-align:center;font-size:18px">우리 반 평균 자산 <b>${man(avg)}</b> (${pctTxt((avg / START_MONEY - 1) * 100)})</p>
    <div class="podium">${pod}</div>
    <h2>🏅 특별상</h2><div class="badges">${badges.map((b, i) => `<div class="badge pop" style="animation-delay:${3 + i * .5}s"><div class="bi">${b.i}</div><div class="bn">${b.n}</div><div class="bw">${esc(b.who)}</div><div class="bd">${b.d}</div></div>`).join('')}</div>
    <h2>전체 순위</h2><div class="card">${rankTable(sorted, {}, 99)}</div>
    <p style="text-align:center;margin-top:24px"><a class="btn" href="?rank" target="_blank">🌏 다른 반과 비교 (명예의 전당)</a></p></div>`;
  bindTeacherCommon();
}
function teacherManage() {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><div style="display:flex;align-items:center"><h1 style="flex:1">👥 학생 관리</h1><button class="btn sm ghost" id="mx">닫기</button></div>
    <p class="muted">학생이 기기를 바꿨거나 창을 닫아 다시 못 들어오면 <b>재입장 코드</b>를 알려 주세요. 기록은 그대로 유지돼요. 번호를 잘못 입력한 학생은 삭제 후 다시 입장시키면 돼요.</p>
    <table class="rank">${T.players.map(p => `<tr><td>${p.number}</td><td style="font-weight:700">${esc(p.nickname)}</td><td class="n">${man(p.value)}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-re="${p.number}">재입장 코드</button> <button class="btn sm ghost" data-del="${p.number}" style="color:var(--up)">삭제</button></td></tr>`).join('') || '<tr><td class="muted">아직 학생이 없어요</td></tr>'}</table></div>`;
  document.body.appendChild(m);
  m.querySelector('#mx').onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelectorAll('[data-re]').forEach(b => b.onclick = async () => {
    try { const r = await rpc('sg_teacher_reissue', { p_code: T.code, p_pin: T.pin, p_number: +b.dataset.re }); b.outerHTML = `<b style="font-size:18px;letter-spacing:2px">${r.rejoin}</b>`; }
    catch (e) { toast(e.message, true); }
  });
  m.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm(`${b.dataset.del}번 학생을 삭제할까요? 기록도 함께 지워져요.`)) return;
    try { await rpc('sg_teacher_remove_player', { p_code: T.code, p_pin: T.pin, p_number: +b.dataset.del }); m.remove(); await teacherRefresh(); }
    catch (e) { toast(e.message, true); }
  });
}

// =====================================================
//                   명예의 전당
// =====================================================
async function rankBoot() {
  app.innerHTML = topBar('<span class="pill">🌏 명예의 전당</span>') + `<div class="wrap"><div class="muted">불러오는 중…</div></div>`;
  const games = await q(sb.from('sg_games').select('id,code,class_name,phase,round,created_at,ended_at').eq('scenario', 'S1').order('created_at', { ascending: false }));
  const ids = games.map(g => g.id);
  const players = ids.length ? await q(sb.from('sg_players').select('id,nickname,number,value,game_id').in('game_id', ids)) : [];
  const gm = Object.fromEntries(games.map(g => [g.id, g]));
  const finals = games.filter(g => g.phase === 'final');
  const finP = players.filter(p => gm[p.game_id].phase === 'final').sort((a, b) => b.value - a.value);
  const classes = games.map(g => {
    const ps = players.filter(p => p.game_id === g.id);
    return { g, n: ps.length, avg: ps.length ? ps.reduce((s, p) => s + p.value, 0) / ps.length : 0, top: ps.slice().sort((a, b) => b.value - a.value)[0] };
  }).filter(c => c.n > 0).sort((a, b) => (b.g.phase === 'final') - (a.g.phase === 'final') || b.avg - a.avg);
  const date = s => new Date(s).toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' });
  const view = tab => {
    document.getElementById('rbody').innerHTML = tab === 'hall'
      ? `<div class="card">${finP.length ? `<table class="rank"><tr><th></th><th>이름</th><th>반</th><th style="text-align:right">최종 자산</th><th style="text-align:right">수익률</th></tr>${finP.slice(0, 20).map((p, i) => `<tr><td class="medal">${medal(i)}</td><td style="font-weight:800">${esc(p.nickname)}</td><td>${esc(gm[p.game_id].class_name)}</td><td class="n">${man(p.value)}</td><td class="n ${cls(p.value - START_MONEY)}">${pctTxt((p.value / START_MONEY - 1) * 100)}</td></tr>`).join('')}</table>` : '<div class="muted">아직 끝난 게임이 없어요.</div>'}</div>`
      : `<div class="card"><table class="rank"><tr><th></th><th>반</th><th>날짜</th><th style="text-align:right">인원</th><th style="text-align:right">평균 자산</th><th>반 1등</th></tr>${classes.map((c, i) => `<tr style="${c.g.phase === 'final' ? '' : 'opacity:.55'}"><td class="medal">${c.g.phase === 'final' ? medal(i) : '⏳'}</td><td style="font-weight:800">${esc(c.g.class_name)}</td><td>${date(c.g.created_at)}${c.g.phase === 'final' ? '' : ` · 진행 중(${c.g.round}/5)`}</td><td class="n">${c.n}</td><td class="n ${cls(c.avg - START_MONEY)}">${man(c.avg)}</td><td>${c.top ? esc(c.top.nickname) : ''}</td></tr>`).join('')}</table></div>`;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  };
  app.innerHTML = topBar('<span class="pill">🌏 명예의 전당</span>') + `<div class="wrap"><h1>🌏 미래경제 5년 · 명예의 전당</h1>
    <div class="muted">모든 반이 똑같은 뉴스와 주가로 플레이해서 공정하게 비교할 수 있어요. 끝난 게임 ${finals.length}개 · 참가 ${finP.length}명</div>
    <div class="tabs"><button data-t="hall">🏆 개인 TOP 20</button><button data-t="class">🏫 반별 대결</button></div><div id="rbody"></div></div>`;
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => view(b.dataset.t));
  view('hall');
}

// ===================== 시작 =====================
(async () => {
  try {
    await loadCompanies();
    if (qs.has('rank')) await rankBoot();
    else if (qs.has('teacher') || qs.has('t')) await teacherBoot();
    else await studentBoot();
  } catch (e) {
    app.innerHTML = `<div class="wrap center"><div class="card"><h1>연결 오류</h1><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">다시 시도</button></div></div>`;
  }
})();
</script>
