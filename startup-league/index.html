<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>학교 앞 창업 리그</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#fff8ec;--ink:#2b1d12;--sub:#7a6552;--card:#fff;--line:#f0dfc6;--red:#ff5a4e;--yellow:#ffc93c;--green:#2fbf71;--blue:#3d8bfd;--shadow:0 6px 0 #e8d3b3;}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
body{background-image:repeating-linear-gradient(90deg,#ff5a4e 0 40px,#fff 40px 80px);background-size:100% 18px;background-repeat:no-repeat}
#app{max-width:1200px;margin:0 auto;padding:34px 16px 60px}
.mobile #app{max-width:520px}
h1,h2,h3{margin:0 0 10px;letter-spacing:-.02em}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;margin-bottom:16px}
.brand small{font-weight:600;color:var(--sub);font-size:13px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.btn{appearance:none;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);font:inherit;font-weight:800;font-size:16px;padding:12px 18px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.red{background:var(--red);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.white{background:#fff}.btn.blue{background:var(--blue);color:#fff}
.btn.big{font-size:20px;padding:16px 24px}.btn.full{width:100%}.btn.sm{font-size:13px;padding:6px 10px;box-shadow:0 2px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select{font:inherit;font-size:17px;padding:12px;border:2px solid var(--ink);border-radius:12px;width:100%;background:#fff}
label{font-weight:700;font-size:14px;display:block;margin:12px 0 6px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.muted{color:var(--sub)}.center{text-align:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.menuPick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.menuPick button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 2px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.menuPick button .e{font-size:30px;display:block}
.menuPick button.on{border-color:var(--ink);background:#fff1c9;box-shadow:0 3px 0 var(--ink)}
.event{background:linear-gradient(135deg,#2b1d12,#4a3220);color:#fff;border-radius:20px;padding:22px;border:2px solid var(--ink);box-shadow:var(--shadow);margin-bottom:16px}
.event .tag{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
.event .em{font-size:48px}
.event h2{font-size:26px}
.event p{margin:4px 0 0;opacity:.9;line-height:1.5}
.effects{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:99px;padding:4px 10px;font-weight:700;font-size:13px}
.chip.up{background:#d7f7e5}.chip.down{background:#ffe0dd}
.stat{background:#fff7e6;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--sub);font-weight:700}.stat .v{font-size:19px;font-weight:900}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:20px;font-weight:900;cursor:pointer;flex:none}
.stepper input{text-align:center;font-weight:800;font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.chips button.on{border-color:var(--ink);background:var(--yellow)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:2px solid var(--line);border-radius:14px;margin-top:8px;cursor:pointer;background:#fff}
.toggle.on{border-color:var(--ink);background:#e9fbf1}
.toggle .sw{width:48px;height:28px;border-radius:99px;background:#ddd;position:relative;flex:none;border:2px solid var(--ink)}
.toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:.15s}
.toggle.on .sw{background:var(--green)}.toggle.on .sw::after{left:22px}
.preview{background:#2b1d12;color:#fff;border-radius:14px;padding:14px;font-size:14px;line-height:1.8}
.preview b{color:var(--yellow)}
.preview .warn{color:#ff8f86;font-weight:800}
.receipt{font-family:ui-monospace,Menlo,monospace;background:#fff;border:2px dashed var(--ink);border-radius:8px;padding:14px;font-size:14px}
.receipt .l{display:flex;justify-content:space-between;padding:3px 0}
.receipt .t{border-top:2px dashed var(--ink);margin-top:6px;padding-top:8px;font-weight:900;font-size:17px}
.plus{color:var(--green)}.minus{color:var(--red)}
.luckCard{background:linear-gradient(135deg,#ffe57a,#ffb84d);border:2px solid var(--ink);border-radius:18px;padding:16px;text-align:center;box-shadow:var(--shadow);margin-bottom:16px;animation:pop .6s ease}
.luckCard.bad{background:linear-gradient(135deg,#d9d9e8,#a9adc9)}
.luckCard .em{font-size:52px}
@keyframes pop{0%{transform:scale(.3) rotate(-10deg);opacity:0}70%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.rise{animation:rise .5s ease both}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:6px 10px;font-weight:700;font-size:15px;animation:pop .4s ease}
.pchip.done{background:#d7f7e5}.pchip.wait{background:#fff;opacity:.55}
.big-num{font-size:64px;font-weight:900;line-height:1}
.code{font-size:64px;font-weight:900;letter-spacing:.15em;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 18px;display:inline-block}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:2px solid var(--line);text-align:left;font-size:15px}
th{font-size:12px;color:var(--sub)}
td.r,th.r{text-align:right}
.rank1{background:#fff1c9}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:16px 0}
.podium .col{text-align:center;width:180px}
.podium .bar{border:2px solid var(--ink);border-radius:12px 12px 0 0;background:var(--yellow);display:flex;align-items:flex-start;justify-content:center;font-size:40px;font-weight:900;padding-top:10px}
.badge{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 12px}
.badge .e{font-size:30px}
.progress{height:22px;border:2px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.progress>div{height:100%;background:var(--green);transition:width .4s}
.timer{font-size:48px;font-weight:900;font-variant-numeric:tabular-nums}
.timer.hurry{color:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:99;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .card{max-width:640px;max-height:88vh;overflow:auto;margin:0}
.rules li{margin:6px 0;line-height:1.5}
.festBox{background:#e9f3ff;border:2px solid var(--blue);border-radius:16px;padding:14px;margin-top:12px}
.tp-wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
@media(max-width:860px){.tp-wrap{grid-template-columns:1fr}.g5{grid-template-columns:repeat(3,1fr)}}
.qr{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px;width:220px;height:220px}
.spin{display:inline-block;animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.hl{background:linear-gradient(transparent 60%,#ffe57a 60%)}
.offer{background:linear-gradient(135deg,#fff3d6,#ffe1f0);border:2px solid var(--ink);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.offer .tag{display:inline-block;background:#ff7eb6;color:#fff;font-weight:800;font-size:12px;padding:3px 10px;border-radius:99px;margin-bottom:8px}
details summary{list-style:none}details summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== 창업 리그 계산 엔진 =====
const CFG = {

const MENUS = {
  tteok:  { name: '떡볶이',  emoji: '🌶️', cost: 1500, ref: 3500, color: '#ff5a4e' },
  burger: { name: '수제버거', emoji: '🍔', cost: 2500, ref: 5500, color: '#f5a623' },

const EVENTS = [
  { id: 1, emoji: '🔥', title: '폭염 경보 발령!', desc: '연일 35도. 시원한 디저트를 찾는 손님이 몰리고, 뜨거운 음식은 외면받아요.', mult: { bingsu: 1.8, tteok: 0.7, hotdog: 0.85 } },
  { id: 2, emoji: '❄️', title: '한파와 첫눈', desc: '갑자기 영하로! 따끈한 길거리 음식이 생각나는 날씨예요.', mult: { tteok: 1.6, hotdog: 1.35, bingsu: 0.4 } },
  { id: 3, emoji: '📱', title: '마라 떡볶이 먹방 대유행', desc: '유명 먹방 유튜버 영상이 터지면서 떡볶이 검색량이 3배가 됐어요.', mult: { tteok: 1.5 } },
  { id: 4, emoji: '📺', title: '수제버거 다큐 방영', desc: '“두툼한 패티의 비밀” 다큐가 화제! 버거 맛집 탐방이 유행이에요.', mult: { burger: 1.5 } },
  { id: 5, emoji: '🌾', title: '밀가루 가격 폭등', desc: '국제 밀 가격이 치솟아 밀가루가 들어가는 메뉴의 재료비가 크게 올랐어요.', cost: { waffle: 1.4, hotdog: 1.4, burger: 1.3, tteok: 1.2 } },
  { id: 6, emoji: '📝', title: '중간고사 기간', desc: '학생들이 공부하느라 길거리에 나오지 않아요. 전체 손님이 줄어요.', all: 0.75 },
  { id: 7, emoji: '🎉', title: '지역 축제 시즌', desc: '동네 축제가 열려 거리에 사람이 북적북적! 모든 가게 손님이 늘어요.', all: 1.35 },
  { id: 8, emoji: '☔', title: '장마 시작', desc: '비가 계속 와서 손님이 줄었어요. 그래도 따뜻한 간식은 조금 더 팔려요.', all: 0.8, mult: { hotdog: 1.15, tteok: 1.1, bingsu: 0.8 } },
  { id: 9, emoji: '🥗', title: '다이어트 열풍', desc: '“여름 전 다이어트!” 칼로리 높은 메뉴를 피하는 손님이 많아졌어요.', mult: { burger: 0.7, hotdog: 0.75, waffle: 0.8 } },
  { id: 10, emoji: '🎤', title: '아이돌 와플 광고', desc: '인기 아이돌이 와플 먹는 광고가 나왔어요. 와플 인기 급상승!', mult: { waffle: 1.7 } },
  { id: 11, emoji: '🏢', title: '대형 프랜차이즈 입점', desc: '길 건너에 대형 프랜차이즈가 생겼어요. 손님이 줄고, 광고의 힘이 더 중요해졌어요.', all: 0.85, ad: 1.6 },
  { id: 12, emoji: '🏦', title: '금리 인상', desc: '중앙은행이 금리를 올렸어요! 이번 달 대출 이자가 5% → 10%로 올라요.', rate: 0.10 },
  { id: 13, emoji: '💰', title: '용돈 인상의 달', desc: '설날 세뱃돈 효과! 손님 지갑이 두둑해서 가격에 덜 민감해요.', all: 1.15, elastic: 1.1 },
  { id: 14, emoji: '⭐', title: '맛집 리뷰 앱 대유행', desc: '별점이 모든 걸 결정하는 시대! 품질(설비) 효과가 2배가 돼요.', qual: 2 },
  { id: 15, emoji: '🛵', title: '배달앱 서비스 시작', desc: '배달앱 광고로 손님을 끌 수 있게 됐어요. 광고 효과 2배!', ad: 2 },
  { id: 16, emoji: '📰', title: '핫도그 위생 가짜뉴스', desc: '“핫도그 기름이 위험하다”는 확인 안 된 소문이 퍼졌어요.', mult: { hotdog: 0.6 } },
  { id: 17, emoji: '🧊', title: '얼음값 폭등', desc: '제빙기 고장 대란! 빙수 재료비가 크게 올랐어요.', cost: { bingsu: 1.5 } },
  { id: 99, emoji: '🎄', title: '연말 대목 시즌!', desc: '마지막 달! 크리스마스와 연말 모임으로 거리가 사람으로 가득해요. 손님 +50%. 마지막 승부를 걸 때예요!', all: 1.5 },
  { id: 18, emoji: '🏷️', title: '가성비 열풍', desc: '“싼 게 최고!” 손님들이 가격을 꼼꼼히 비교해요. 가격에 아주 민감해졌어요.', elastic: 2.1 },
];
const LUCK = [
  { id: 'youtuber', emoji: '🎬', title: '유명 유튜버 방문!', desc: '손님 ×2', mult: 2.0, good: true },
  { id: 'regular', emoji: '😍', title: '단골손님 생김', desc: '손님 +30%', mult: 1.3, good: true },
  { id: 'closed', emoji: '🚧', title: '옆 가게 휴업', desc: '손님 +50%', mult: 1.5, good: true },
  { id: 'tour', emoji: '🚌', title: '관광버스 정차', desc: '손님 +70%', mult: 1.7, good: true },
  { id: 'rain', emoji: '🌧️', title: '우리 가게만 소나기', desc: '손님 -25%', mult: 0.75, good: false },
  { id: 'spoil', emoji: '🦠', title: '냉장고 고장', desc: '준비한 재료 20% 폐기', spoil: 0.2, good: false },
];

function won(n) { n = Math.round(n || 0); return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('ko-KR') + '원'; }
function shuffle(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function eventById(id) { return EVENTS.find(e => e.id === id) || EVENTS[0]; }
function pickEventOrder(n) {
  // 마지막 달은 항상 연말 대목. 금리 인상(12)은 3라운드 이후에만
  let ids = shuffle(EVENTS.filter(e => e.id !== 99).map(e => e.id));
  let sel = ids.slice(0, n - 1);
  for (let t = 0; t < 30; t++) {
    const i12 = sel.indexOf(12);
    if (i12 === -1 || i12 >= 2) break;
    ids = shuffle(ids); sel = ids.slice(0, n - 1);
  }
  return [...sel, 99];
}
const OFFERS = [
  { id: 'tv', emoji: '📺', title: 'TV 맛집 프로그램 섭외', desc: '출연료 20만원을 내면 50% 확률로 방송이 나가 이번 달 손님 ×2.5! 편집되면 돈만 날려요.', cost: 200000 },
  { id: 'investor', emoji: '🤵', title: '투자자의 제안', desc: '지금 30만원을 받는 대신, 이번 달 이익(세전)의 50%를 투자자에게 줘요. 이익이 없으면 안 줘도 돼요.', cost: 0 },
  { id: 'insurance', emoji: '🛡️', title: '손해 보험 가입', desc: '보험료 5만원. 이번 달 이익이 마이너스면 손해를 최대 30만원까지 보상해 줘요.', cost: 50000 },
  { id: 'coupon', emoji: '🎟️', title: '반값 쿠폰 이벤트', desc: '이번 달 모든 손님에게 30% 할인! 손님은 2배로 늘지만 1개당 받는 돈은 줄어요.', cost: 0 },
  { id: 'lottery', emoji: '🎰', title: '상가 번영회 복권', desc: '1만원짜리 복권! 5% 확률로 50만원 당첨. 대부분은 꽝이에요.', cost: 10000 },
  { id: 'copurchase', emoji: '🤝', title: '재료 공동 구매', desc: '이웃 가게들과 재료를 함께 사서 재료비 25% 할인! 대신 이번 달은 광고를 할 수 없어요.', cost: 0 },
  { id: 'delivery', emoji: '🛵', title: '배달 대행 계약', desc: '수수료 8만원을 내면 배달 손님이 생겨서 이번 달 손님 +40%.', cost: 80000 },
  { id: 'recipe', emoji: '📜', title: '수상한 비밀 레시피', desc: '15만원에 전설의 레시피를 판대요. 50% 확률로 품질 +2단계, 50%는 가짜…', cost: 150000 },
  { id: 'donation', emoji: '💝', title: '착한 가게 기부', desc: '5만원을 기부하면 “착한 가게” 소문이 나서 다음 달 손님 +25%.', cost: 50000 },
];
function offerById(id) { return OFFERS.find(o => o.id === id); }
function pickOfferOrder(n) { const o = shuffle(OFFERS.map(x => x.id)); while (o.length < n) o.push(...shuffle(OFFERS.map(x => x.id))); return o.slice(0, n); }
function unitCostOf(menu, quality, ev) { return Math.round(MENUS[menu].cost * ((ev.cost && ev.cost[menu]) || 1) + quality * CFG.QUAL_UNIT); }
function clampInt(v, lo, hi) { v = Math.round(Number(v) || 0); return Math.max(lo, Math.min(hi, v)); }

function autoDecision(p, ev) {
  const m = MENUS[p.menu];
  const last = p.last;
  return { price: last ? last.price : m.ref, qty: last ? Math.max(30, Math.round(last.demand * 0.6)) : 60, ad: 0, borrow: 0, repay: 0, upgrade: false, festival: false, offer: false, menu: p.menu, auto: true };
}

function sanitize(d) {
  return {
    price: clampInt(d.price, CFG.PRICE_MIN, CFG.PRICE_MAX),
    qty: clampInt(d.qty, 0, CFG.QTY_MAX),
    ad: clampInt(d.ad, 0, 500000),
    borrow: clampInt(d.borrow, 0, CFG.LOAN_MAX),
    repay: clampInt(d.repay, 0, 10000000),
    upgrade: !!d.upgrade, festival: !!d.festival, offer: !!d.offer, auto: !!d.auto,
    menu: MENUS[d.menu] ? d.menu : null,
  };
}

// players: [{id,cls,nickname,shop,menu,cash,loan,quality,last,history}]
// decisions: {player_id: data}
function computeRound(players, decisions, eventId, roundNo, offerId, rnd = Math.random) {
  const ev = eventById(eventId);
  const offer = offerId ? offerById(offerId) : null;
  const N = players.length;
  const isFest = CFG.FEST_ROUNDS.includes(roundNo);
  const rate = ev.rate || CFG.RATE;
  const elastic = ev.elastic || 1.6;
  const adBoost = ev.ad || 1, qualBoost = ev.qual || 1, all = ev.all || 1;

  const st = players.map(p => {
    const raw = decisions[p.id];
    const d = sanitize(raw ? raw : autoDecision(p, ev));
    if (!raw) d.auto = true;
    let cash = p.cash, loan = p.loan, q = p.quality, menu = p.menu, switched = false;
    const borrow = Math.min(d.borrow, Math.max(0, CFG.LOAN_MAX - loan));
    cash += borrow; loan += borrow;
    const repay = Math.min(d.repay, loan, Math.max(0, cash));
    cash -= repay; loan -= repay;
    if (d.menu && d.menu !== p.menu && cash >= CFG.SWITCH_COST) { cash -= CFG.SWITCH_COST; menu = d.menu; switched = true; }
    let upgraded = false;
    if (d.upgrade && q < CFG.QUAL_MAX && cash >= CFG.UPG_COST) { cash -= CFG.UPG_COST; q++; upgraded = true; }
    let fest = false;
    if (isFest && d.festival && cash >= CFG.FEST_COST) { cash -= CFG.FEST_COST; fest = true; }
    // 특별 제안
    let took = false, offerNote = null, dm = 1, costMul = 1, noAd = false, priceMul = 1, recipeWin = false;
    if (offer && d.offer) {
      if (offer.id === 'investor') { cash += 300000; took = true; }
      else if (cash >= offer.cost) {
        cash -= offer.cost; took = true;
        if (offer.id === 'tv') { if (rnd() < 0.5) { dm *= 2.5; offerNote = '📺 방송 대박! 손님 ×2.5'; } else offerNote = '✂️ 편집돼서 방송에 안 나왔어요…'; }
        if (offer.id === 'coupon') { dm *= 2; priceMul = 0.7; }
        if (offer.id === 'delivery') dm *= 1.4;
        if (offer.id === 'recipe') { if (rnd() < 0.5) { q = Math.min(CFG.QUAL_MAX, q + 2); recipeWin = true; offerNote = '📜 진짜 레시피였어요! 품질 +2'; } else offerNote = '📜 가짜 레시피였어요… 😭'; }
      }
      if (offer.id === 'copurchase') { took = true; costMul = 0.75; noAd = true; }
    }
    if (p.last && p.last.goodwill) dm *= 1.25;
    cash -= CFG.RENT;
    const ad = noAd ? 0 : Math.min(d.ad, Math.max(0, cash)); cash -= ad;
    const uc = Math.round(unitCostOf(menu, q, ev) * costMul);
    const qty = Math.min(d.qty, Math.floor(Math.max(0, cash) / uc));
    cash -= qty * uc;
    return { p, d, cash, loan, q, menu, switched, borrow, repay, upgraded, fest, ad, uc, qty, took, offerNote, dm, priceMul, recipeWin };
  });

  // 반별 축제 판정
  const festByCls = {};
  if (isFest) {
    const grp = {};
    st.forEach(s => { const c = s.p.cls || 1; (grp[c] ||= { n: 0, y: 0 }); grp[c].n++; if (s.fest) grp[c].y++; });
    Object.entries(grp).forEach(([c, g]) => { festByCls[c] = { n: g.n, y: g.y, rate: Math.round(g.y / g.n * 100), success: g.y / g.n >= CFG.FEST_TH }; });
  }

  // 행운 카드
  const k = N ? Math.max(1, Math.round(N * (N > 60 ? 0.08 : 0.12))) : 0;
  shuffle(st.map((_, i) => i), rnd).slice(0, k).forEach(i => {
    const good = rnd() < 0.72;
    const pool = LUCK.filter(c => c.good === good);
    st[i].luck = pool[Math.floor(rnd() * pool.length)];
  });

  // 수요 계산 (학년 전체 하나의 시장)
  st.forEach(s => {
    const m = MENUS[s.menu];
    const mm = (ev.mult && ev.mult[s.menu]) || 1;
    s.price = Math.round(s.d.price * s.priceMul);
    const pf = Math.pow(m.ref / s.d.price, elastic);
    const af = 1 + 0.45 * Math.log(1 + s.ad / 30000) * adBoost;
    const qf = 1 + 0.15 * s.q * qualBoost;
    s.fb = isFest && festByCls[s.p.cls || 1]?.success ? CFG.FEST_BOOST : 1;
    const noise = 0.92 + rnd() * 0.16;
    s.raw = CFG.BASE * pf * af * qf * all * mm * s.fb * noise;
  });
  const menuCount = {};
  st.forEach(s => { menuCount[s.menu] = (menuCount[s.menu] || 0) + 1; });
  Object.keys(menuCount).forEach(menu => {
    const group = st.filter(s => s.menu === menu);
    const mm = (ev.mult && ev.mult[menu]) || 1;
    const avgFb = group.reduce((a, s) => a + s.fb, 0) / group.length;
    const cap = (100 * N / 5 + 45 * group.length) * all * mm * avgFb;
    const sum = group.reduce((a, s) => a + s.raw, 0);
    const f = sum > cap ? cap / sum : 1;
    group.forEach(s => { s.capped = f < 1; s.raw *= f; });
  });

  const results = st.map(s => {
    let qty = s.qty, spoiled = 0, lm = s.dm;
    if (s.luck) { if (s.luck.spoil) { spoiled = Math.round(qty * s.luck.spoil); qty -= spoiled; } if (s.luck.mult) lm *= s.luck.mult; }
    const demand = Math.max(0, Math.round(s.raw * lm));
    const sales = Math.min(demand, qty);
    const revenue = sales * s.price;
    let cash = s.cash + revenue;
    const interest = Math.round(s.loan * rate);
    const goods = s.qty * s.uc;
    const offerCost = s.took && offer && offer.id !== 'investor' && offer.id !== 'copurchase' ? offer.cost : 0;
    let pre = revenue - goods - s.ad - CFG.RENT - interest - (s.fest ? CFG.FEST_COST : 0) - (s.switched ? CFG.SWITCH_COST : 0) - offerCost;
    let extra = 0, offerNote = s.offerNote;
    if (s.took && offer) {
      if (offer.id === 'investor') { const share = pre > 0 ? Math.round(pre * 0.5) : 0; extra = 300000 - share; offerNote = `🤵 30만원 받고 이익의 절반 ${won(share)} 지급`; }
      if (offer.id === 'insurance') { if (pre < 0) { extra = Math.min(-pre, 300000); offerNote = `🛡️ 보험금 ${won(extra)} 받았어요!`; } else offerNote = '🛡️ 다행히 보험금 받을 일이 없었어요'; }
      if (offer.id === 'lottery') { if (rnd() < 0.05) { extra = 500000; offerNote = '🎰 복권 당첨!!! +50만원'; } else offerNote = '🎰 꽝…'; }
      if (offer.id === 'coupon') offerNote = '🎟️ 반값 쿠폰으로 손님 2배!';
      if (offer.id === 'copurchase') offerNote = '🤝 공동 구매로 재료비 25% 절약';
      if (offer.id === 'delivery') offerNote = '🛵 배달 손님 +40%';
      if (offer.id === 'donation') offerNote = '💝 다음 달 “착한 가게” 효과 +25%';
    }
    // investor: 30만원은 이미 cash에 들어갔으니 지분만 차감
    if (s.took && offer && offer.id === 'investor') cash -= (300000 - extra);
    else cash += extra;
    pre += extra;
    const tax = pre > 0 ? Math.round(pre * CFG.TAX) : 0;
    cash -= interest + tax;
    let loan = s.loan, emergency = 0;
    if (cash < 0) { emergency = -cash; loan += emergency; cash = 0; }
    const profit = pre - tax;
    const last = {
      round: roundNo, eventId, offerId: offerId || null, cls: s.p.cls || 1, menu: s.menu, switched: s.switched,
      price: s.price, listPrice: s.d.price, qty: s.qty, demand, sales,
      leftover: qty - sales, spoiled, missed: Math.max(0, demand - qty), unitCost: s.uc,
      revenue, goods, ad: s.ad, rent: CFG.RENT, interest, tax, profit,
      upgraded: s.upgraded, fest: s.fest, borrow: s.borrow, repay: s.repay, emergency,
      offer: s.took, offerNote, offerCost, offerExtra: extra, goodwill: !!(s.took && offer && offer.id === 'donation'),
      luck: s.luck ? s.luck.id : null, auto: s.d.auto, capped: !!s.capped,
      cash, loan, quality: s.q, net: cash - loan,
    };
    return { id: s.p.id, cash, loan, quality: s.q, menu: s.menu, last };
  });

  // 순위 (학년 전체 / 반 내)
  results.slice().sort((a, b) => b.last.net - a.last.net).forEach((r, i) => { r.last.rank = i + 1; r.last.of = N; });
  const byCls = {};
  results.forEach(r => (byCls[r.last.cls] ||= []).push(r));
  Object.values(byCls).forEach(g => g.sort((a, b) => b.last.net - a.last.net).forEach((r, i) => { r.last.crank = i + 1; r.last.cof = g.length; }));

  const byId = Object.fromEntries(players.map(p => [p.id, p]));
  const menuStats = {};
  Object.keys(MENUS).forEach(mk => {
    const g = results.filter(r => r.menu === mk);
    if (!g.length) return;
    menuStats[mk] = {
      n: g.length,
      avgPrice: Math.round(g.reduce((a, r) => a + r.last.price, 0) / g.length),
      avgSales: Math.round(g.reduce((a, r) => a + r.last.sales, 0) / g.length),
      avgDemand: Math.round(g.reduce((a, r) => a + r.last.demand, 0) / g.length),
      avgProfit: Math.round(g.reduce((a, r) => a + r.last.profit, 0) / g.length),
    };
  });
  const classes = Object.entries(byCls).map(([c, g]) => ({
    cls: +c, n: g.length,
    avgNet: Math.round(g.reduce((a, r) => a + r.last.net, 0) / g.length),
    avgProfit: Math.round(g.reduce((a, r) => a + r.last.profit, 0) / g.length),
    submit: Math.round(g.filter(r => !r.last.auto).length / g.length * 100),
    fest: festByCls[c] || null,
  })).sort((a, b) => b.avgNet - a.avgNet);
  const prevRank = {};
  const mini = r => ({ cls: r.last.cls, nickname: byId[r.id].nickname, shop: byId[r.id].shop, menu: r.menu });
  const sortedP = results.slice().sort((a, b) => b.last.profit - a.last.profit);
  const tookN = results.filter(r => r.last.offer).length;
  const reveal = {
    round: roundNo, eventId, offerId: offerId || null,
    offerStat: offer ? { took: tookN, rate: N ? Math.round(tookN / N * 100) : 0,
      hits: results.filter(r => r.last.offer && /대박|진짜|당첨/.test(r.last.offerNote || '')).slice(0, 6).map(r => ({ ...mini(r), note: r.last.offerNote })) } : null,
    classes,
    luck: results.filter(r => r.last.luck).slice(0, 12).map(r => ({ ...mini(r), luck: r.last.luck })),
    luckTotal: results.filter(r => r.last.luck).length,
    top: sortedP.slice(0, 5).map(r => ({ ...mini(r), profit: r.last.profit })),
    worst: sortedP.length > 5 ? { ...mini(sortedP[sortedP.length - 1]), profit: sortedP[sortedP.length - 1].last.profit } : null,
    switched: results.filter(r => r.last.switched).length,
    menuStats,
    avgNet: N ? Math.round(results.reduce((a, r) => a + r.last.net, 0) / N) : 0,
    avgProfit: N ? Math.round(results.reduce((a, r) => a + r.last.profit, 0) / N) : 0,
    autoCount: results.filter(r => r.last.auto).length,
  };
  return { results, reveal };
}

function computeBadges(players) {
  if (!players.length) return [];
  const H = p => p.history || [];
  const sum = (p, k) => H(p).reduce((a, h) => a + (h[k] || 0), 0);
  const awarded = new Set();
  const best = (fn) => {
    const pick = pool => { let b = null, bv = 0; pool.forEach(p => { const v = fn(p); if (v > bv) { bv = v; b = p; } }); return b; };
    const b = pick(players.filter(p => !awarded.has(p.id))) || pick(players);
    if (b) awarded.add(b.id);
    return b;
  };
  const out = [];
  const add = (p, emoji, title, why) => { if (p) out.push({ id: p.id, nickname: p.nickname, shop: p.shop, emoji, title, why }); };
  const rev = best(p => sum(p, 'revenue')); add(rev, '👑', '매출왕', won(sum(rev || {}, 'revenue')));
  const eff = best(p => { const q = sum(p, 'qty'); return q > 0 ? (sum(p, 'sales') / q) * 1000 + q / 1000 : 0; });
  if (eff) { const q = sum(eff, 'qty'); add(eff, '🎯', '재고 제로 장인', `판매율 ${Math.round(sum(eff, 'sales') / q * 100)}%`); }
  const adk = best(p => sum(p, 'ad')); add(adk, '📣', '광고왕', won(sum(adk || {}, 'ad')));
  const fest = best(p => H(p).filter(h => h.fest).length); add(fest, '🤝', '의리왕', '축제 부스 참여');
  const comeback = best(p => { const h = H(p); return h.length > 1 ? h[0].rank - h[h.length - 1].rank : 0; });
  if (comeback) { const h = H(comeback); add(comeback, '🚀', '역전왕', `${h[0].rank}위 → ${h[h.length - 1].rank}위`); }
  const lucky = best(p => H(p).filter(h => h.luck && LUCK.find(c => c.id === h.luck)?.good).length); add(lucky, '🍀', '행운아', '행운 카드 최다');
  const safe = best(p => (p.loan === 0 && H(p).every(h => !h.borrow && !h.emergency)) ? (p.cash + 1) : 0); add(safe, '🛡️', '무차입 경영', '대출 없이 ' + won(safe ? safe.cash : 0));
  return out;
}

    <input id="code" maxlength="4" placeholder="게임 코드" style="text-align:center;font-size:28px;font-weight:900;letter-spacing:.2em;text-transform:uppercase">
    <div style="height:12px"></div>
    <button class="btn big full" onclick="location.href='?code='+document.getElementById('code').value.trim().toUpperCase()">참가하기</button>
  </div>
  <div class="center"><button class="btn white sm" onclick="location.href='?teacher=1'">👩‍🏫 선생님 화면</button></div>`;
}

// =====================================================================
const S = { code: null, game: null, me: null, auth: null, sig: '', draft: null, submitted: false, fails: 0 };

async function studentStart(code) {
  document.body.classList.add('mobile');
  S.code = code.toUpperCase();
  try { S.auth = JSON.parse(localStorage.getItem('bl_' + S.code) || 'null'); } catch (e) { S.auth = null; }
  if (S.auth) {
    const st = await rpc('bl_state', { p_player: S.auth.player_id, p_key: S.auth.key }).catch(() => null);
    if (st) { S.game = st.game; S.me = st.me; return sLoop(); }
    localStorage.removeItem('bl_' + S.code); S.auth = null;
  }
  const { data: g } = await sb.from('bl_games').select('*').eq('code', S.code).maybeSingle();
  if (!g) { app.innerHTML = `<div class="card center"><h2>😢 코드를 찾을 수 없어요</h2><p class="muted">코드 ${esc(S.code)}를 다시 확인해 주세요.</p><button class="btn" onclick="location.href='?'">다시 입력</button></div>`; return; }
  S.game = g; sJoinForm();
}

function sJoinForm() {
  let menu = null; const g = S.game;
  app.innerHTML = `
  <div class="brand">🚚 창업 리그 <small>${esc(g.class_name)}</small></div>
  <div class="card">
    <h2>내 푸드트럭 차리기</h2>
    <div class="grid g2">
      <div><label>반</label><select id="cls"><option value="">선택</option>${Array.from({ length: g.class_count }, (_, i) => `<option value="${i + 1}">${i + 1}반</option>`).join('')}</select></div>
      <div><label>번호</label><input id="num" type="number" inputmode="numeric" min="1" max="40" placeholder="예: 7"></div>
    </div>
    <label>별명</label><input id="nick" maxlength="12" placeholder="예: 떡볶이장인">
    <label>가게 이름</label><input id="shop" maxlength="14" placeholder="예: 매운맛 천국">
    <label>첫 메뉴 고르기 <span class="muted">(나중에 10만원 내고 바꿀 수 있어요)</span></label>
    <div class="menuPick">${Object.entries(MENUS).map(([k, m]) => `<button data-k="${k}"><span class="e">${m.emoji}</span>${m.name}<br><span class="muted" style="font-weight:600">원가 ${m.cost.toLocaleString()}</span></button>`).join('')}</div>
    <div style="height:14px"></div>
    <button class="btn big full red" id="go">🚚 가게 오픈!</button>
    <div style="height:8px"></div>
    <button class="btn white full" onclick="showRules()">📖 게임 규칙 보기</button>
  </div>`;
  app.querySelectorAll('.menuPick button').forEach(b => b.onclick = () => { menu = b.dataset.k; app.querySelectorAll('.menuPick button').forEach(x => x.classList.toggle('on', x === b)); });
  $('#go').onclick = async () => {
    const cls = parseInt($('#cls').value), num = parseInt($('#num').value), nick = $('#nick').value.trim(), shop = $('#shop').value.trim();
    if (!cls) return toast('반을 선택하세요');
    if (!num) return toast('번호를 입력하세요');
    if (!nick) return toast('별명을 입력하세요');
    if (!menu) return toast('메뉴를 골라주세요');
    $('#go').disabled = true;
    try {
      const r = await rpc('bl_join', { p_code: S.code, p_cls: cls, p_num: num, p_nick: nick, p_shop: shop || nick + '네', p_menu: menu });
      S.auth = r; localStorage.setItem('bl_' + S.code, JSON.stringify(r));
      const st = await rpc('bl_state', { p_player: r.player_id, p_key: r.key });
      S.game = st.game; S.me = st.me; sLoop();
    } catch (e) { toast(e.message); $('#go').disabled = false; }
  };
}

function sLoop() { stopPoll(); S.sig = ''; sTick(); }
async function sTick() {
  let delay = 3500 + Math.random() * 1500;
  try {
    const st = await rpc('bl_state', { p_player: S.auth.player_id, p_key: S.auth.key });
    S.fails = 0;
    if (!st) { localStorage.removeItem('bl_' + S.code); app.innerHTML = `<div class="card center"><h2>참가 정보가 사라졌어요</h2><p class="muted">선생님이 참가를 취소했거나 게임을 지웠어요.</p><button class="btn" onclick="location.reload()">다시 참가</button></div>`; return; }
    const g = st.game, me = st.me;
    S.game = g; S.me = me;
    const sig = [g.status, g.round, (me.history || []).length].join('|');
    if (sig !== S.sig) {
      const roundChanged = S.sig.split('|')[1] !== String(g.round) || S.sig.split('|')[0] !== g.status;
      S.sig = sig;
      if (g.status === 'lobby') sLobby();
      else if (g.status === 'deciding') { if (roundChanged) { S.draft = st.decision || null; S.submitted = !!st.decision; } sDecide(); }
      else if (g.status === 'closed') app.innerHTML = `<div class="card center"><div class="spin" style="font-size:48px">🧮</div><h2>마감! 정산 중이에요…</h2><p class="muted">두근두근 결과를 기다려요</p></div>`;
      else if (g.status === 'revealed') sReveal();
      else if (g.status === 'finished') { sFinal(); return; }
    }
  } catch (e) { S.fails++; delay = Math.min(15000, 3000 * S.fails); console.warn(e); }
  pollTimer = setTimeout(sTick, delay);
}
function myHeader() {
  const me = S.me, m = MENUS[me.menu];
  return `<div class="card" style="padding:14px">
    <div class="row"><div style="font-size:40px">${m.emoji}</div><div class="grow"><div style="font-weight:900;font-size:19px">${esc(me.shop)}</div><div class="muted" style="font-size:13px">${me.cls}반 ${me.num}번 ${esc(me.nickname)} 사장님 · ${m.name}${me.quality ? ' · ' + '⭐'.repeat(me.quality) : ''}</div></div></div>
    <div class="grid g3" style="margin-top:10px">
      <div class="stat"><div class="k">💵 현금</div><div class="v">${man(me.cash)}</div></div>
      <div class="stat"><div class="k">🏦 대출</div><div class="v">${man(me.loan)}</div></div>
      <div class="stat"><div class="k">🏆 순자산</div><div class="v">${man(me.cash - me.loan)}</div></div>
    </div></div>`;
}
function sLobby() {
  app.innerHTML = `<div class="brand">🚚 창업 리그 <small>${esc(S.game.class_name)}</small></div>${myHeader()}
  <div class="card center"><div style="font-size:48px" class="spin">🍳</div><h2>가게 오픈 준비 완료!</h2><p class="muted">선생님이 게임을 시작할 때까지 기다려 주세요.<br>그동안 규칙을 꼭 읽어 두세요.</p>
  <button class="btn white" onclick="showRules()">📖 게임 규칙 보기</button></div>`;
}

function sDecide() {
  const g = S.game, me = S.me, ev = eventById(g.event_order[g.round - 1]);
  const offer = offerById((g.offer_order || [])[g.round - 1]);
  const isFest = CFG.FEST_ROUNDS.includes(g.round);
  const last = me.last;
  if (!S.draft) {
    const m0 = MENUS[me.menu];
    S.draft = { price: last && last.menu === me.menu ? last.listPrice || last.price : m0.ref, qty: last ? Math.min(CFG.QTY_MAX, Math.max(10, last.demand)) : 100, ad: 0, borrow: 0, repay: 0, upgrade: false, festival: false, offer: false, menu: me.menu };
  }
  if (!S.draft.menu) S.draft.menu = me.menu;
  const ms = g.reveal && g.reveal.menuStats || {};
  const hint = last ? `<div class="stat" style="margin-bottom:12px;font-size:14px;line-height:1.6">📊 <b>지난달 내 기록</b><br>${MENUS[last.menu].emoji} 가격 ${last.price.toLocaleString()}원 · 준비 ${last.qty}개 → 손님 <b>${last.demand}명</b>, 판매 ${last.sales}개${last.leftover ? ` · <span class="minus">버림 ${last.leftover}개</span>` : ''}${last.missed ? ` · <span class="minus">놓친 손님 ${last.missed}명</span>` : ''}</div>` : `<div class="stat" style="margin-bottom:12px;font-size:14px">💡 첫 달이에요! 가게 하나에 한 달 손님은 보통 100명 안팎이에요.</div>`;
  const adOpts = [0, 10000, 30000, 50000, 100000, 200000];
  const borrowOpts = [0, 100000, 300000, 500000];
  const canBorrow = Math.max(0, CFG.LOAN_MAX - me.loan);
  app.innerHTML = `<div class="brand">🚚 창업 리그 <small>${me.cls}반 · ${g.round}월</small></div>
  ${eventCard(ev, g.round, g.total_rounds)}
  ${myHeader()}
  <div class="card">
    <h2>📝 ${g.round}월 운영 계획</h2>
    ${hint}
    ${last && last.goodwill ? `<div class="stat" style="margin-bottom:12px;background:#ffe9f2">💝 지난달 기부 덕분에 이번 달 손님 +25%!</div>` : ''}
    <label>🍽️ 이번 달 메뉴 <span class="muted">(바꾸면 10만원 · 지난달 학년 전체 가게 수/평균 손님)</span></label>
    <div class="menuPick" id="menu">${Object.entries(MENUS).map(([k, m]) => `<button data-k="${k}" class="${S.draft.menu === k ? 'on' : ''}"><span class="e">${m.emoji}</span>${m.name}<br><span class="muted" style="font-weight:600;font-size:11px">${ms[k] ? `${ms[k].n}곳 · ${ms[k].avgDemand}명` : (last ? '0곳' : '')}${k === me.menu ? '<br>현재' : ''}</span></button>`).join('')}</div>
    <label>🏷️ 판매 가격 (1개) <span class="muted" id="refp"></span></label>
    <div class="stepper"><button data-s="price" data-d="-500">−</button><button data-s="price" data-d="-100" style="font-size:14px">-100</button><input id="price" type="number" inputmode="numeric" value="${S.draft.price}"><button data-s="price" data-d="100" style="font-size:14px">+100</button><button data-s="price" data-d="500">+</button></div>
    <label>📦 준비할 수량 <span class="muted">(1개 원가 <b id="uc"></b>)</span></label>
    <div class="stepper"><button data-s="qty" data-d="-50">−</button><button data-s="qty" data-d="-10" style="font-size:14px">-10</button><input id="qty" type="number" inputmode="numeric" value="${S.draft.qty}"><button data-s="qty" data-d="10" style="font-size:14px">+10</button><button data-s="qty" data-d="50">+</button></div>
    <label>📣 광고비</label>
    <div class="chips" id="ad">${adOpts.map(v => `<button data-v="${v}" class="${S.draft.ad === v ? 'on' : ''}">${v ? man(v) : '안 함'}</button>`).join('')}</div>
    ${offer ? `<div style="height:14px"></div>${offerCard(offer)}<div class="toggle ${S.draft.offer ? 'on' : ''}" id="offer"><b>${offer.emoji} 제안 받아들이기${offer.cost ? ` (${man(offer.cost)})` : ''}</b><div class="sw"></div></div>` : ''}
    ${isFest ? `<div class="festBox"><b>🎪 우리 반 축제 부스 투표!</b><p style="margin:6px 0;font-size:14px">5만원을 내고 참여할까요? <b>우리 반 60% 이상</b>이 참여하면 이번 달 <b>우리 반 전체</b> 손님 +30%! 다른 반과의 대결에서 큰 차이를 만들어요.</p>
      <div class="toggle ${S.draft.festival ? 'on' : ''}" id="fest"><b>🙋 5만원 내고 참여하기</b><div class="sw"></div></div></div>` : ''}
    <details style="margin-top:12px"><summary style="font-weight:800;cursor:pointer;padding:6px 0">🏦 대출 · ⭐ 설비 투자 (고급)</summary>
    <label>🏦 대출 <span class="muted">(현재 ${man(me.loan)}, 이자 월 ${Math.round((ev.rate || CFG.RATE) * 100)}%)</span></label>
    <div class="chips" id="borrow">${borrowOpts.filter(v => v <= canBorrow).map(v => `<button data-v="${v}" class="${S.draft.borrow === v ? 'on' : ''}">${v ? man(v) + ' 빌리기' : '안 빌림'}</button>`).join('')}</div>
    ${me.loan > 0 ? `<label>💸 대출 갚기</label><div class="chips" id="repay">${[0, 100000, 300000, me.loan].filter((v, i, a) => v <= me.loan && a.indexOf(v) === i).map(v => `<button data-v="${v}" class="${S.draft.repay === v ? 'on' : ''}">${v === 0 ? '안 갚음' : v === me.loan ? '전부 갚기' : man(v)}</button>`).join('')}</div>` : ''}
    ${me.quality < CFG.QUAL_MAX ? `<div class="toggle ${S.draft.upgrade ? 'on' : ''}" id="upg"><div><b>⭐ 설비 투자 (20만원)</b><br><span class="muted" style="font-size:13px">품질 ${me.quality} → ${me.quality + 1}단계: 손님 +15%, 원가 +200원</span></div><div class="sw"></div></div>` : `<div class="stat" style="margin-top:8px">⭐ 설비 최고 단계 달성!</div>`}
    </details>
    <div style="height:14px"></div>
    <div class="preview" id="pv"></div>
    <div style="height:14px"></div>
    <button class="btn big full ${S.submitted ? 'green' : 'red'}" id="submit">${S.submitted ? '✅ 제출 완료 (다시 누르면 수정)' : '🚀 이번 달 계획 제출!'}</button>
    <p class="muted center" style="font-size:13px">마감 전까지 몇 번이든 수정할 수 있어요. 제출 안 하면 알바생이 대충 운영해서 우리 반 평균이 떨어져요 😅</p>
  </div>`;

  const upd = () => {
    const d = S.draft;
    d.price = Math.max(CFG.PRICE_MIN, Math.min(CFG.PRICE_MAX, parseInt($('#price').value) || 0));
    d.qty = Math.max(0, Math.min(CFG.QTY_MAX, parseInt($('#qty').value) || 0));
    let cash = me.cash + Math.min(d.borrow, canBorrow);
    const repay = Math.min(d.repay, me.loan, cash); cash -= repay;
    const sw = d.menu !== me.menu ? CFG.SWITCH_COST : 0;
    let q = me.quality + (d.upgrade && me.quality < CFG.QUAL_MAX ? 1 : 0);
    const upgCost = d.upgrade && me.quality < CFG.QUAL_MAX ? CFG.UPG_COST : 0;
    const festCost = isFest && d.festival ? CFG.FEST_COST : 0;
    let offCost = 0, costMul = 1, priceMul = 1, noAd = false;
    if (offer && d.offer) {
      if (offer.id === 'investor') cash += 300000; else offCost = offer.cost;
      if (offer.id === 'copurchase') { costMul = 0.75; noAd = true; }
      if (offer.id === 'coupon') priceMul = 0.7;
    }
    const ad = noAd ? 0 : d.ad;
    const uc = Math.round(unitCostOf(d.menu, q, ev) * costMul);
    $('#uc').textContent = uc.toLocaleString() + '원';
    $('#refp').textContent = `(${MENUS[d.menu].name} 보통 ${MENUS[d.menu].ref.toLocaleString()}원 안팎)`;
    const goods = d.qty * uc;
    const fixed = sw + upgCost + festCost + offCost + CFG.RENT + ad;
    const left = cash - fixed - goods;
    const maxQty = Math.max(0, Math.floor((cash - fixed) / uc));
    const sell = Math.round(d.price * priceMul);
    const margin = sell - uc;
    $('#pv').innerHTML = `쓸 수 있는 돈 <b>${man(cash)}</b><br>
      재료비 ${d.qty}개 × ${uc.toLocaleString()}원 = <b>${man(goods)}</b><br>
      임대료 ${man(CFG.RENT)}${ad ? ` · 광고 ${man(ad)}` : ''}${sw ? ` · 메뉴 변경 ${man(sw)}` : ''}${upgCost ? ` · 설비 ${man(upgCost)}` : ''}${festCost ? ` · 축제 ${man(festCost)}` : ''}${offCost ? ` · 제안 ${man(offCost)}` : ''}${noAd && d.ad ? ' <span class="warn">(공동 구매라 광고 불가)</span>' : ''}<br>
      남는 현금 <b>${man(left)}</b> ${left < 0 ? `<span class="warn">⚠ 돈이 모자라요! 최대 ${maxQty}개까지만 준비돼요</span>` : ''}<br>
      1개 팔 때마다 <b class="${margin > 0 ? '' : 'warn'}">${margin > 0 ? '+' : ''}${margin.toLocaleString()}원</b>${priceMul < 1 ? ` (쿠폰 할인가 ${sell.toLocaleString()}원)` : ''} ${margin <= 0 ? '<span class="warn">⚠ 팔수록 손해!</span>' : ''} · 다 팔면 매출 ${man(d.qty * sell)}`;
  };
  app.querySelectorAll('.stepper button').forEach(b => b.onclick = () => { const el = $('#' + b.dataset.s); el.value = Math.max(0, (parseInt(el.value) || 0) + parseInt(b.dataset.d)); upd(); });
  ['price', 'qty'].forEach(id => $('#' + id).oninput = upd);
  app.querySelectorAll('#menu button').forEach(b => b.onclick = () => {
    const k = b.dataset.k; if (k === S.draft.menu) return;
    S.draft.menu = k; $('#price').value = MENUS[k].ref;
    app.querySelectorAll('#menu button').forEach(x => x.classList.toggle('on', x === b)); upd();
    if (k !== me.menu) toast(`${MENUS[k].emoji} ${MENUS[k].name}(으)로 변경! 10만원이 들어요`);
  });
  const chipGroup = (id, key) => { const el = $('#' + id); if (!el) return; el.querySelectorAll('button').forEach(b => b.onclick = () => { S.draft[key] = parseInt(b.dataset.v); el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); upd(); }); };
  chipGroup('ad', 'ad'); chipGroup('borrow', 'borrow'); chipGroup('repay', 'repay');
  const tog = (id, key) => { const el = $('#' + id); if (!el) return; el.onclick = () => { S.draft[key] = !S.draft[key]; el.classList.toggle('on', S.draft[key]); upd(); }; };
  tog('upg', 'upgrade'); tog('fest', 'festival'); tog('offer', 'offer');
  upd();
  $('#submit').onclick = async () => {
    upd();
    const b = $('#submit'); b.disabled = true;
    try {
      await rpc('bl_submit', { p_player: me.id, p_key: S.auth.key, p_round: g.round, p_data: S.draft });
      S.submitted = true; b.className = 'btn big full green'; b.textContent = '✅ 제출 완료 (다시 누르면 수정)'; toast('제출 완료! 결과 발표를 기다려요 🍀');
    } catch (e) { toast(e.message); }
    b.disabled = false;
  };
}

function receipt(L) {
  const line = (k, v, cls = '') => `<div class="l"><span>${k}</span><span class="${cls}">${v}</span></div>`;
  return `<div class="receipt">
    ${line('메뉴 / 가격', `${MENUS[L.menu].emoji} ${MENUS[L.menu].name} ${L.price.toLocaleString()}원`)}
    ${line('찾아온 손님', L.demand + '명')}
    ${line('준비 / 판매', `${L.qty}개 / ${L.sales}개`)}
    ${L.spoiled ? line('🦠 고장으로 폐기', L.spoiled + '개', 'minus') : ''}
    ${L.leftover ? line('남아서 버림', L.leftover + '개', 'minus') : ''}
    ${L.missed ? line('재료 부족으로 놓친 손님', L.missed + '명', 'minus') : ''}
    <div style="height:6px"></div>
    ${line('매출', '+' + won(L.revenue), 'plus')}
    ${line('재료비', '-' + won(L.goods), 'minus')}
    ${line('임대료', '-' + won(L.rent), 'minus')}
    ${L.ad ? line('광고비', '-' + won(L.ad), 'minus') : ''}
    ${L.switched ? line('메뉴 변경', '-' + won(CFG.SWITCH_COST), 'minus') : ''}
    ${L.fest ? line('축제 부스', '-' + won(CFG.FEST_COST), 'minus') : ''}
    ${L.offerCost ? line('특별 제안 비용', '-' + won(L.offerCost), 'minus') : ''}
    ${L.offerExtra ? line('특별 제안 결과', (L.offerExtra > 0 ? '+' : '') + won(L.offerExtra), L.offerExtra > 0 ? 'plus' : 'minus') : ''}
    ${L.interest ? line('대출 이자', '-' + won(L.interest), 'minus') : ''}

async function tTick() {
  if (!T.busy) {
    try {
      const [{ data: g }, { data: ps }] = await Promise.all([
        sb.from('bl_games').select('*').eq('id', T.game.id).maybeSingle(),
        sb.from('bl_players').select('id,cls,num,nickname,shop,menu,cash,loan,quality,last,created_at').eq('game_id', T.game.id).order('created_at'),
      ]);
      if (!g) return tHome();
      T.game = g; T.players = ps || [];
      if (g.status === 'deciding' || g.status === 'closed') {
        const d = await rpc('bl_decided', { p_pin: T.pin, p_game: g.id, p_round: g.round });
        T.decided = new Set(d || []);
      }
      const sig = [g.status, g.round, T.players.length, T.players.map(p => p.id).join('').length, T.decided.size, T.step].join('|');
      if (sig !== T.sig) { T.sig = sig; tRender(); }

  }
  pollTimer = setTimeout(tTick, 2500);

  T.busy = true; const btn = $('#close'); if (btn) { btn.disabled = true; btn.textContent = '🧮 정산 중…'; }
  try {
    await rpc('bl_set_game', { p_pin: T.pin, p_game: g.id, p_status: 'closed', p_round: g.round, p_reveal: g.reveal });
    await new Promise(r => setTimeout(r, 800));
    const [{ data: ps }, decs] = await Promise.all([
      sb.from('bl_players').select('*').eq('game_id', g.id),
      rpc('bl_get_decisions', { p_pin: T.pin, p_game: g.id, p_round: g.round }),
    ]);
    const dm = {}; (decs || []).forEach(x => dm[x.player_id] = x.data);
    const { results, reveal } = computeRound(ps, dm, g.event_order[g.round - 1], g.round, (g.offer_order || [])[g.round - 1]);
    for (let i = 0; i < results.length; i += 100) await rpc('bl_apply', { p_pin: T.pin, p_game: g.id, p_results: results.slice(i, i + 100) });
    await rpc('bl_set_game', { p_pin: T.pin, p_game: g.id, p_status: 'revealed', p_round: g.round, p_reveal: reveal });
    T.step = 0;
  } catch (e) { toast('오류: ' + e.message + ' (다시 눌러 주세요)', 6000); }
  T.busy = false; T.sig = ''; stopPoll(); tTick();
}
function tReveal() {
  const g = T.game, R = g.reveal || {}, ev = eventById(R.eventId), offer = offerById(R.offerId);
  const last = g.round >= g.total_rounds;
  const steps = ['뉴스·제안 결과', '행운 카드', '이달의 TOP 5', '메뉴별 시장', '반 대항 순위'];
  const nav = `<div class="row" style="justify-content:center;margin-top:8px">
    ${T.step > 0 ? `<button class="btn white" onclick="T.step--;T.sig='';tRender()">◀ 이전</button>` : ''}
    ${T.step < steps.length - 1 ? `<button class="btn big" onclick="T.step++;T.sig='';tRender()">다음: ${steps[T.step + 1]} ▶</button>` :
      (last ? `<button class="btn big red" onclick="tFinish()">🏆 최종 결과 발표!</button>` : `<button class="btn big red" onclick="tStartRound(${g.round + 1})">📰 ${g.round + 1}월 뉴스 공개 ▶</button>`)}</div>`;
  let body = '';
  if (T.step === 0) {
    const os = R.offerStat;
    body = eventCard(ev, g.round, g.total_rounds) + (offer ? `<div class="offer rise"><div class="row"><div style="font-size:56px">${offer.emoji}</div><div class="grow"><h2 style="margin:0">${esc(offer.title)}</h2><div style="font-size:20px">학년 전체 <b>${os.rate}%</b>(${os.took}명)가 제안을 받아들였어요!</div>
      ${os.hits && os.hits.length ? `<div style="margin-top:8px">${os.hits.map(h => `<span class="chip up" style="margin:2px">${MENUS[h.menu].emoji} ${who(h)} · ${esc(h.note)}</span>`).join('')}</div>` : ''}</div></div></div>` : '') + `
    <div class="grid g3"><div class="card center"><div class="muted">학년 평균 이익</div><div class="big-num" style="font-size:40px">${man(R.avgProfit)}</div></div>
    <div class="card center"><div class="muted">메뉴를 바꾼 가게</div><div class="big-num" style="font-size:40px">${R.switched || 0}곳</div></div>
    <div class="card center"><div class="muted">알바생 운영(미제출)</div><div class="big-num" style="font-size:40px">${R.autoCount || 0}명</div></div></div>`;
  } else if (T.step === 1) {
    body = `<h1 class="center">🍀 이달의 행운 · 불운 카드 <span class="muted" style="font-size:18px">(총 ${R.luckTotal || 0}명)</span></h1><div class="grid g3">${(R.luck || []).map((l, i) => { const c = LUCK.find(x => x.id === l.luck); return `<div class="luckCard ${c.good ? '' : 'bad'}" style="animation-delay:${i * .25}s;margin:0"><div style="font-size:40px">${c.emoji}</div><h3 style="margin:4px 0">${esc(l.shop)}</h3><div style="color:#333">${MENUS[l.menu].emoji} ${who(l)}</div><div style="font-weight:900;margin-top:4px">${c.title} · ${c.desc}</div></div>`; }).join('')}</div>`;
  } else if (T.step === 2) {
    body = `<div class="card"><h1>🏅 ${g.round}월 이익 TOP 5</h1><table>${(R.top || []).map((t, i) => `<tr class="rise ${i === 0 ? 'rank1' : ''}" style="animation-delay:${(4 - i) * .4}s"><td style="font-size:30px;width:60px">${MEDAL[i] || i + 1}</td><td style="font-size:22px"><b>${MENUS[t.menu].emoji} ${esc(t.shop)}</b> <span class="muted">${who(t)}</span></td><td class="r" style="font-size:24px"><b>${man(t.profit)}</b></td></tr>`).join('')}</table></div>
    ${R.worst ? `<div class="card rise" style="animation-delay:2.4s;background:#ffe9e7"><h2>😱 이달의 눈물 젖은 가게</h2><div style="font-size:22px">${MENUS[R.worst.menu].emoji} <b>${esc(R.worst.shop)}</b> <span class="muted">${who(R.worst)}</span> · <b class="minus">${man(R.worst.profit)}</b></div><p class="muted" style="margin:6px 0 0">다음 달엔 역전할 수 있어요! 힘내요 💪</p></div>` : ''}`;
  } else if (T.step === 3) {
    const msx = R.menuStats || {};
    body = `<div class="card"><h1>📊 메뉴별 시장 분석 (학년 전체)</h1><p class="muted">가게가 몰린 메뉴와 한산한 메뉴, 어디가 더 벌었을까요? 다음 달 메뉴를 바꿀지 고민해 보세요!</p>
      <table><tr><th>메뉴</th><th class="r">가게 수</th><th class="r">평균 가격</th><th class="r">평균 손님</th><th class="r">평균 이익</th></tr>
      ${Object.entries(msx).map(([k, s]) => `<tr><td style="font-size:20px">${MENUS[k].emoji} ${MENUS[k].name}</td><td class="r">${s.n}</td><td class="r">${s.avgPrice.toLocaleString()}원</td><td class="r">${s.avgDemand}명</td><td class="r"><b>${man(s.avgProfit)}</b></td></tr>`).join('')}</table></div>`;
  } else {
    const cl = R.classes || [];
    const maxNet = Math.max(...cl.map(c => c.avgNet), 1);
    body = `<div class="card"><h1>🏫 ${g.round}월 반 대항 순위</h1><p class="muted">1인당 평균 순자산 · 아래에서부터 공개!</p>
      ${cl.map((c, i) => ({ c, i })).reverse().map(({ c, i }, k) => `<div class="rise" style="animation-delay:${k * .45}s;display:flex;align-items:center;gap:12px;margin:8px 0">
        <div style="width:56px;font-size:30px;text-align:center">${MEDAL[i] || i + 1}</div><div style="width:70px;font-size:24px;font-weight:900">${c.cls}반</div>
        <div style="flex:1;background:#fff;border:2px solid var(--ink);border-radius:10px;height:38px;overflow:hidden"><div style="height:100%;width:${Math.max(8, c.avgNet / maxNet * 100)}%;background:${i === 0 ? 'var(--yellow)' : '#ffd88a'};display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-weight:900">${man(c.avgNet)}</div></div>
        <div style="width:170px;font-size:13px" class="muted">${c.fest ? (c.fest.success ? `🎪 성공 ${c.fest.rate}%` : `🎪 실패 ${c.fest.rate}%`) + ' · ' : ''}제출 ${c.submit}%</div></div>`).join('')}</div>`;
  }
  app.innerHTML = tTop(`<span class="chip">${g.round}월 결산 · ${T.step + 1}/${steps.length}</span> `) + body + nav;
}
async function tFinish() {
  T.busy = true;
  try { await rpc('bl_set_game', { p_pin: T.pin, p_game: T.game.id, p_status: 'finished', p_round: T.game.round, p_reveal: T.game.reveal }); } catch (e) { toast(e.message); }
  T.busy = false; T.sig = ''; stopPoll(); tTick();
}
async function tFinal() {
  stopPoll();
  const g = T.game, R = g.reveal || {}, cl = R.classes || [];
  const { data } = await sb.from('bl_players').select('id,cls,num,nickname,shop,menu,cash,loan,history').eq('game_id', g.id);
  const ps = (data || []).sort((a, b) => (b.cash - b.loan) - (a.cash - a.loan));
  const badges = computeBadges(ps);
  const mvp = {}; ps.forEach(p => { if (!mvp[p.cls]) mvp[p.cls] = p; });
  const pod = i => cl[i] ? `<div class="col rise" style="animation-delay:${(2 - i) * .6}s"><div style="font-size:48px;font-weight:900">${cl[i].cls}반</div><div style="font-weight:900;font-size:18px">${man(cl[i].avgNet)}</div><div class="bar" style="height:${[180, 130, 95][i]}px;background:${['#ffc93c', '#d9dde6', '#e8b07a'][i]}">${MEDAL[i]}</div></div>` : '';
  app.innerHTML = tTop() + `
  <div class="card center"><h1>🏆 ${esc(g.class_name)} 반 대항 최종 결과</h1><div class="podium">${pod(1)}${pod(0)}${pod(2)}</div>
    <table style="max-width:640px;margin:0 auto">${cl.map((c, i) => `<tr class="${i === 0 ? 'rank1' : ''}"><td>${MEDAL[i] || i + 1}</td><td><b>${c.cls}반</b> <span class="muted">${c.n}명</span></td><td class="r">평균 순자산 <b>${man(c.avgNet)}</b></td><td class="r muted">MVP ${mvp[c.cls] ? esc(mvp[c.cls].nickname) : '-'}</td></tr>`).join('')}</table></div>
  <div class="tp-wrap">
    <div class="card"><h2>🥇 개인 TOP 10</h2><table>${ps.slice(0, 10).map((p, i) => `<tr class="${i === 0 ? 'rank1' : ''}"><td>${MEDAL[i] || i + 1}</td><td>${MENUS[p.menu].emoji} <b>${esc(p.shop)}</b> <span class="muted">${p.cls}반 ${esc(p.nickname)}</span></td><td class="r"><b>${man(p.cash - p.loan)}</b></td></tr>`).join('')}</table></div>
    <div class="card"><h2>🏅 칭호</h2><div class="grid">${badges.map(b => { const p = ps.find(x => x.id === b.id); return `<div class="badge rise"><div class="e">${b.emoji}</div><div><b>${b.title}</b> · ${esc(b.shop)}<div class="muted" style="font-size:13px">${p ? p.cls + '반 ' : ''}${esc(b.nickname)} · ${esc(b.why)}</div></div></div>`; }).join('')}</div></div>
  </div>
  <div class="card"><h2>💬 마무리 토론 질문</h2><ol class="rules"><li>가격을 올렸을 때와 내렸을 때 손님 수는 어떻게 달라졌나요? (수요의 법칙)</li><li>가게가 몰린 메뉴와 한산한 메뉴 중 어디가 더 벌었나요? 메뉴를 바꾼 친구는 성공했나요? (경쟁과 틈새시장)</li><li>우리 반 축제 부스는 성공했나요? 참여하지 않은 이유는? (무임승차, 공공재)</li><li>특별 제안 중 가장 이득이었던 것과 손해였던 것은? 위험과 기대 수익을 비교해 봐요. (위험과 선택)</li></ol></div>`;
}

// ===== 라우팅 =====
if (params.get('code')) studentStart(params.get('code'));
else if (params.get('teacher')) teacherStart(params.get('game'));
else landing();

</script>
